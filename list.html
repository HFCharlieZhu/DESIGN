(function () {
"use strict";

/* ============================================================
   設定
   ============================================================ */

var API_URL = "https://script.google.com/macros/s/AKfycbyZgxQNyQuQCX_Vmp5tlrgQ6p_-pEugmehm9StOCbp3IC32WeDjYoST1iqiCuM7VZDN/exec";
var GOOGLE_CLIENT_ID = "610204517549-khmef2c4ejmeg0jrceg53385ptu2ns03.apps.googleusercontent.com";
var ALLOWED_DOMAIN = "harfunco.com";
var URGENT_WORKING_DAYS = 5;
var PAGE_SIZE = 20;

/* ============================================================
   共用區塊 A：登入狀態保存（兩頁完全相同，請一起更新）
   ============================================================ */

var AUTH = (function () {
  var KEY = "dr_auth_v3";
  var MAX_AGE_MS = 2 * 60 * 60 * 1000;   // 與後端閒置逾時一致
  var token = "";
  var user = null;

  function persist() {
    var payload = JSON.stringify({ token: token, user: user, savedAt: Date.now() });
    try { localStorage.setItem(KEY, payload); } catch (e) { }
    try { sessionStorage.setItem(KEY, payload); } catch (e) { }
  }

  function parse(raw) {
    if (!raw) return null;
    try {
      var p = JSON.parse(raw);
      if (!p || !p.token || !p.savedAt) return null;
      if (Date.now() - Number(p.savedAt) > MAX_AGE_MS) return null;
      return p;
    } catch (e) { return null; }
  }

  function load() {
    var p = null;
    try { p = parse(sessionStorage.getItem(KEY)); } catch (e) { }
    if (!p) { try { p = parse(localStorage.getItem(KEY)); } catch (e) { } }
    if (!p) { token = ""; user = null; return false; }
    token = p.token;
    user = p.user && p.user.email ? p.user : null;
    return true;
  }

  return {
    load: load,
    token: function () { return token; },
    user: function () { return user; },
    set: function (nextToken, nextUser) {
      if (nextToken) token = nextToken;
      if (nextUser && nextUser.email) user = nextUser;
      if (token) persist();
    },
    clear: function () {
      token = "";
      user = null;
      try { localStorage.removeItem(KEY); } catch (e) { }
      try { sessionStorage.removeItem(KEY); } catch (e) { }
    },
    /** 其他分頁登出或登入時同步本頁。 */
    watch: function (onLoggedOut, onLoggedIn) {
      window.addEventListener("storage", function (e) {
        if (e.key !== KEY) return;
        if (!e.newValue) { token = ""; user = null; onLoggedOut(); return; }
        var had = !!token;
        load();
        if (!had && token) onLoggedIn();
      });
    }
  };
})();

/* ============================================================
   共用區塊 B：API 呼叫（兩頁完全相同，請一起更新）
   ============================================================ */

var googleCredential = "";
var lastApiAt = Date.now();   // 頁面剛載入就算一次往來，避免開場的心跳與第一次請求重複

function apiError(message, code) {
  var err = new Error(message || "後端處理失敗。");
  err.code = code || "API_ERROR";
  return err;
}

function fetchJson(body, timeoutMs) {
  if (navigator.onLine === false) {
    return Promise.reject(apiError("目前沒有網路連線，請連線後再試。", "OFFLINE"));
  }
  var controller = window.AbortController ? new AbortController() : null;
  var timer = controller ? setTimeout(function () { controller.abort(); }, timeoutMs || 25000) : 0;

  return fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8", "Accept": "application/json" },
    body: JSON.stringify(body),
    signal: controller ? controller.signal : undefined,
    cache: "no-store",
    credentials: "omit",
    referrerPolicy: "no-referrer",
    mode: "cors"
  }).then(function (res) {
    return res.text().then(function (text) {
      var trimmed = String(text || "").trim();
      if (!trimmed || trimmed.charAt(0) === "<") {
        console.error("Apps Script 未以 JSON 回應，請確認部署為「執行身分：我」「誰可以存取：任何人」。");
        throw apiError("系統暫時無法連線，請稍後再試。", "DEPLOYMENT_ACCESS");
      }
      var json;
      try { json = JSON.parse(trimmed); }
      catch (e) {
        console.error("Apps Script 回應不是有效 JSON，可能不是最新的部署網址。");
        throw apiError("系統回應異常，請稍後再試。", "BAD_RESPONSE");
      }
      if (!json || typeof json !== "object") throw apiError("系統回應異常，請稍後再試。", "BAD_RESPONSE");
      if (!json.ok) throw apiError(json.error || "後端處理失敗。", json.code || "API_ERROR");
      return json;
    });
  }).catch(function (err) {
    if (err && err.name === "AbortError") throw apiError("連線逾時，請再試一次。", "TIMEOUT");
    if (err && err.code) throw err;
    if (err instanceof TypeError) throw apiError("無法連線到系統，請檢查網路後再試。", "NETWORK_ENDPOINT");
    throw err;
  }).finally(function () { if (timer) clearTimeout(timer); });
}

var RETRYABLE = ["TIMEOUT", "OFFLINE", "BAD_RESPONSE", "NETWORK_ENDPOINT"];

async function apiPost(action, payload, options) {
  payload = payload || {};
  options = options || {};
  var attempts = 1 + (typeof options.retries === "number" ? Math.max(0, options.retries) : 0);
  var lastErr;

  for (var i = 0; i < attempts; i++) {
    var body = Object.assign({}, payload, { action: action });
    var token = AUTH.token();
    if (token) body.sessionToken = token;
    else if (googleCredential) body.credential = googleCredential;

    try {
      var data = await fetchJson(body, options.timeout || 20000);
      lastApiAt = Date.now();
      if (data.sessionToken) AUTH.set(data.sessionToken, data.user || AUTH.user());
      return data;
    } catch (err) {
      lastErr = err;
      if (err && err.code === "AUTH_REQUIRED") { AUTH.clear(); throw err; }
      if (i + 1 < attempts && RETRYABLE.indexOf(err.code) >= 0) {
        await new Promise(function (r) { setTimeout(r, 450); });
        continue;
      }
      throw err;
    }
  }
  throw lastErr;
}

/* ============================================================
   共用區塊 C：Google 登入畫面（兩頁完全相同，請一起更新）
   ============================================================ */

var gate = document.getElementById("dr-gate");
var app = document.getElementById("dr-app");
var loginSlot = document.getElementById("dr-login-slot");
var loginStatus = document.getElementById("dr-login-status");
var googleReady = false;
var googleLoadPromise = null;

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function setLoginStatus(text, isError) {
  loginStatus.className = "g-status" + (isError ? " is-error" : "");
  loginStatus.textContent = text || "";
}

function showSlotSpinner() {
  loginSlot.replaceChildren(el("span", "session-spinner"));
}

function showSlotRetry(label, onRetry) {
  var btn = el("button", "login-retry-btn", label);
  btn.type = "button";
  btn.addEventListener("click", function () {
    showSlotSpinner();
    setLoginStatus("正在重新連線…", false);
    onRetry();
  });
  loginSlot.replaceChildren(btn);
}

function loadGoogleIdentity() {
  if (window.google && google.accounts && google.accounts.id) return Promise.resolve();
  if (googleLoadPromise) return googleLoadPromise;
  googleLoadPromise = new Promise(function (resolve, reject) {
    var settled = false, timer = 0;
    function done(ok) {
      if (settled) return;
      settled = true;
      if (timer) clearTimeout(timer);
      ok ? resolve() : reject(new Error("GSI_LOAD_FAILED"));
    }
    var script = document.getElementById("dr-gsi-client") || document.getElementById("dr-gsi-bootstrap");
    if (!script) {
      script = document.createElement("script");
      script.id = "dr-gsi-client";
      script.src = "https://accounts.google.com/gsi/client";
      script.async = true;
      script.defer = true;
      document.head.appendChild(script);
    }
    script.addEventListener("load", function () {
      done(!!(window.google && google.accounts && google.accounts.id));
    }, { once: true });
    script.addEventListener("error", function () { done(false); }, { once: true });
    timer = setTimeout(function () {
      done(!!(window.google && google.accounts && google.accounts.id));
    }, 8000);
  }).catch(function (err) { googleLoadPromise = null; throw err; });
  return googleLoadPromise;
}

function renderGoogleButton() {
  if (!window.google || !google.accounts || !google.accounts.id) {
    setLoginStatus("Google 登入服務尚未載入，請再試一次。", true);
    showSlotRetry("重新載入 Google 登入", reloadGoogleIdentity);
    return;
  }
  if (!googleReady) {
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: onGoogleCredential,
      hd: ALLOWED_DOMAIN,
      use_fedcm_for_button: true,
      button_auto_select: false
    });
    googleReady = true;
  }
  loginSlot.replaceChildren();
  google.accounts.id.renderButton(loginSlot, {
    theme: "outline", size: "large", text: "signin_with", shape: "rectangular", width: 300
  });
}

function reloadGoogleIdentity() {
  googleLoadPromise = null;
  googleReady = false;
  var old = document.getElementById("dr-gsi-client");
  if (old) old.remove();
  var boot = document.getElementById("dr-gsi-bootstrap");
  if (boot) boot.remove();
  showGoogleButton();
}

function showGoogleButton(keepMessage) {
  showSlotSpinner();
  if (!keepMessage) setLoginStatus("", false);
  loadGoogleIdentity().then(renderGoogleButton).catch(function () {
    setLoginStatus("Google 登入服務載入失敗，請檢查網路後再試一次。", true);
    showSlotRetry("重新載入 Google 登入", reloadGoogleIdentity);
  });
}

function showGate(message) {
  AUTH.clear();
  googleCredential = "";
  app.hidden = true;
  gate.hidden = false;
  setLoginStatus(message || "", !!message);
  showGoogleButton(!!message);
}

function isInAppBrowser() {
  var ua = (navigator.userAgent || "").toLowerCase();
  return /line\//.test(ua) || /\bfbav\b|\bfban\b/.test(ua) || /instagram/.test(ua) ||
    /messenger/.test(ua) || /micromessenger/.test(ua);
}

var heartbeatTimer = 0;

/* 任何 API 呼叫都會延長登入，因此只有一段時間沒有任何往來時才需要額外續期。 */
function refreshSession() {
  if (document.hidden || !AUTH.token() || navigator.onLine === false) return;
  if (Date.now() - lastApiAt < 10 * 60 * 1000) return;
  apiPost("whoAmI", {}, { timeout: 8000 }).then(function (data) {
    if (data.user) applyUser(data.user);
  }).catch(function (err) {
    if (err && err.code === "AUTH_REQUIRED") {
      saveAllOpenDrafts();
      showGate("登入已逾時，請重新登入。未儲存的編輯會在重新登入後回到原位。");
    }
  });
}

function startHeartbeat() {
  clearInterval(heartbeatTimer);
  heartbeatTimer = setInterval(refreshSession, 20 * 60 * 1000);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) { refreshSession(); updateDateLabel(); }
  }, { passive: true });
  window.addEventListener("pageshow", refreshSession, { passive: true });
  window.addEventListener("online", refreshSession, { passive: true });
}

/* ============================================================
   共用區塊 D：觸控回饋（兩頁完全相同，請一起更新）
   ============================================================ */

function initTouchFeedback(selector) {
  var active = null, outer = null;
  function clear() {
    if (active) { active.classList.remove("is-touch-hover"); active = null; }
    if (outer) { outer.classList.remove("primary-touch-hover"); outer = null; }
  }
  function applyFrom(node) {
    if (!node || !app.contains(node)) { clear(); return; }
    var target = node.closest && node.closest(selector);
    var primary = node.closest && node.closest(".request-primary");
    var nextOuter = primary && primary.closest(".card");
    if (active !== target) {
      if (active) active.classList.remove("is-touch-hover");
      active = target || null;
      if (active) active.classList.add("is-touch-hover");
    }
    if (outer !== nextOuter) {
      if (outer) outer.classList.remove("primary-touch-hover");
      outer = nextOuter || null;
      if (outer) outer.classList.add("primary-touch-hover");
    }
  }
  function fromTouch(touch, fallback) {
    if (!touch) { applyFrom(fallback || null); return; }
    applyFrom(document.elementFromPoint(touch.clientX, touch.clientY) || fallback || null);
  }
  document.addEventListener("touchstart", function (e) {
    if (e.touches && e.touches.length) fromTouch(e.touches[0], e.target);
  }, { passive: true });
  document.addEventListener("touchmove", function (e) {
    if (!e.touches || !e.touches.length) { clear(); return; }
    fromTouch(e.touches[0], e.target);
  }, { passive: true });
  document.addEventListener("touchend", clear, { passive: true });
  document.addEventListener("touchcancel", clear, { passive: true });
  window.addEventListener("blur", clear);
  document.addEventListener("visibilitychange", function () { if (document.hidden) clear(); });
}

/* ============================================================
   共用區塊 E：需求類型定義（兩頁完全相同，請一起更新）
   ============================================================ */

var PRINT_SIZES = [
  { label: "A4", note: "21×29.7cm" },
  { label: "A3", note: "29.7×42cm" },
  { label: "A2", note: "42×59.4cm" },
  { label: "A5", note: "14.8×21cm" },
  { label: "自訂尺寸", custom: true }
];

var TYPES = [
  { id: "web_banner", label: "官網 Banner", mode: "normal", sizes: [{ label: "電腦版" }, { label: "手機版" }], extra: ["page"] },
  { id: "web_subbanner", label: "官網分頁 Banner", mode: "normal", sizes: [{ label: "電腦版" }, { label: "手機版" }], extra: ["page"] },
  { id: "blog", label: "部落格用圖", mode: "normal", sizes: [{ label: "部落格用圖", w: 800, h: 385, unit: "px" }] },
  { id: "thumb", label: "網頁縮圖", mode: "normal", sizes: [{ label: "網頁縮圖", w: 1020, h: 600, unit: "px" }] },
  { id: "social", label: "社群圖", mode: "normal", sizes: [
    { label: "IG 4:5", w: 1080, h: 1350, unit: "px" },
    { label: "FB 4:5", w: 1080, h: 1350, unit: "px" },
    { label: "FB 1:1", w: 1080, h: 1080, unit: "px" },

    { label: "Line 圖文訊息", w: 1040, h: 1040, unit: "px" }
  ] },
  { id: "gads", label: "Google 廣告", mode: "normal", sizes: [
    { label: "正方形", w: 1200, h: 1200, unit: "px" },
    { label: "橫幅", w: 1200, h: 628, unit: "px" },
    { label: "直式", w: 960, h: 1200, unit: "px" }
  ] },
  { id: "edm", label: "EDM", mode: "structure" },
  { id: "landing", label: "活動頁", mode: "structure" },
  { id: "product", label: "商品頁", mode: "notice", notice: "本項文案請前往《長條圖參考分配》填寫。" },
  { id: "print", label: "印刷品", mode: "normal", forcePrint: true, sizes: PRINT_SIZES },
  { id: "booth", label: "展場", mode: "notice", notice: "本項目需另行安排會議。" },
  { id: "other", label: "其他", mode: "normal", sizes: [{ label: "自訂尺寸", custom: true }], showChannel: true }
];

function typeOf(id) {
  for (var i = 0; i < TYPES.length; i++) if (TYPES[i].id === id) return TYPES[i];
  return null;
}

function sizeOptionsFor(item, type) {
  var options = (type.sizes || []).slice();
  if (!type.forcePrint && (item.output || []).indexOf("print") >= 0) {
    PRINT_SIZES.forEach(function (opt) {
      if (!options.some(function (x) { return x.label === opt.label; })) options.push(opt);
    });
  }
  return options;
}

function sizeValueOf(def) {
  if (!def) return "";
  if (def.w && def.h) return def.w + "×" + def.h + (def.unit || "px");
  return def.note || "";
}

function applyDefaultSize(item) {
  var t = typeOf(item.typeId);
  if (!t || !t.sizes || t.sizes.length !== 1) return;
  var d = t.sizes[0];
  if (d.custom) return;
  item.sizeRows[0].purpose = d.label;
  item.sizeRows[0].px = sizeValueOf(d);
}

function itemHasCopy(item) {
  var t = typeOf(item && item.typeId);
  if (!t || t.mode === "notice") return true;
  if (t.mode === "structure") {
    return (item.blocks || []).some(function (b) {
      return !!String((b && b.head) || "").trim() || !!String((b && b.sub) || "").trim() ||
        !!String((b && b.small) || "").trim() || !!String((b && b.other) || "").trim();
    });
  }
  var c = (item && item.copy) || {};
  return !!String(c.head || "").trim() || !!String(c.sub || "").trim() ||
    !!String(c.small || "").trim() || !!String(c.other || "").trim();
}

function itemHasPrint(item) { return (item.output || []).indexOf("print") >= 0; }
function itemHasDigital(item) { return (item.output || []).indexOf("digital") >= 0; }

/* ============================================================
   共用區塊 F：日期工具（兩頁完全相同，請一起更新）
   ============================================================ */

function pad2(n) { return n < 10 ? "0" + n : "" + n; }
function fmtDate(d) { return d.getFullYear() + "/" + pad2(d.getMonth() + 1) + "/" + pad2(d.getDate()); }

function parseDate(s) {
  if (!s) return null;
  var p = String(s).split("-");
  if (p.length !== 3) return null;
  var d = new Date(+p[0], +p[1] - 1, +p[2]);
  return isNaN(d.getTime()) ? null : d;
}

function workingDaysBetween(from, to) {
  if (!from || !to) return null;
  var d = new Date(from.getFullYear(), from.getMonth(), from.getDate());
  var end = new Date(to.getFullYear(), to.getMonth(), to.getDate());
  if (end <= d) return 0;
  var count = 0;
  while (d < end) {
    d.setDate(d.getDate() + 1);
    var wd = d.getDay();
    if (wd !== 0 && wd !== 6) count++;
  }
  return count;
}

/* ============================================================
   共用區塊 G：下拉箭頭方向（兩頁完全相同，請一起更新）
   ============================================================ */

/**
 * 下拉選單關閉時箭頭向下、展開時向上。
 * 支援 :open 的瀏覽器由 CSS 直接處理，這裡只負責補上不支援的瀏覽器，
 * 兩者不會同時作用，避免狀態互相打架。
 */
function initSelectCaret() {
  var native = false;
  try { native = window.CSS && CSS.supports("selector(select:open)"); } catch (e) { native = false; }
  if (native) return;

  var opened = null;
  function close() {
    if (!opened) return;
    opened.classList.remove("is-open");
    opened = null;
  }
  document.addEventListener("mousedown", function (e) {
    var node = e.target;
    var sel = node && node.closest ? node.closest("select") : null;
    if (sel && sel === opened) { close(); return; }   // 再點一次是收合
    close();
    if (sel && !sel.disabled) { sel.classList.add("is-open"); opened = sel; }
  }, true);
  document.addEventListener("change", close, true);
  document.addEventListener("blur", close, true);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" || e.key === "Enter" || e.key === "Tab") close();
  }, true);
  document.addEventListener("visibilitychange", function () { if (document.hidden) close(); });
}

initSelectCaret();

/* 過往資料：預設全部收合。案件區或搜尋欄一有動作就整個收起來。 */
var RECENT_MONTHS = 3;
var archiveOpen = false;
var archiveOpenKeys = Object.create(null);

function resetArchive() {
  archiveOpen = false;
  archiveOpenKeys = Object.create(null);

/** 案件區顯示的區間起點：本月往回數滿 RECENT_MONTHS 個月，跨年照算。 */
function recentCutoff() {
  var now = new Date();
  return new Date(now.getFullYear(), now.getMonth() - (RECENT_MONTHS - 1), 1);
}

function isRecent(rec, cutoff) {
  var d = new Date(rec.submittedAt);
  return !isNaN(d.getTime()) && d >= cutoff;
}
var quickFilter = { overdue: false, error: false };

function initialsOf(name) {
  var parts = String(name || "").trim().split(/\s+/).filter(Boolean);
  if (parts.length >= 2) return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
  return String(name || "").replace(/\s+/g, "").slice(0, 2).toUpperCase();
}

function makeOperationId() {
  return (window.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function sameEmail(a, b) {
  return String(a || "").trim().toLowerCase() === String(b || "").trim().toLowerCase();
}

function updateDateLabel() { $("dr-datetime").textContent = fmtDate(new Date()); }

/* ---------- 權限 ---------- */

function canEditRecord(rec) {
  if (!rec || rec.deleted) return false;
  return !!(rec.isExample || currentUser.isAdmin || sameEmail(currentUser.email, rec.submitter && rec.submitter.email));
}
function canOperateRecord(rec) {
  if (!rec || rec.deleted || rec.isExample) return false;
  return !!(currentUser.isAdmin || sameEmail(currentUser.email, rec.submitter && rec.submitter.email));
}
function canSendWord(rec) {
  if (!rec || rec.deleted) return false;
  return !!(rec.isExample || currentUser.isAdmin || sameEmail(currentUser.email, rec.submitter && rec.submitter.email));
}

/* ---------- 旗標 ---------- */

function todayFromServer() {
  var d = new Date(serverNow.getTime());
  d.setHours(0, 0, 0, 0);
  return d;
}

function isClosedStatus(status) {
  return status === "完稿" || status === "結案" || status === "取消" || status === "退回";
}

function isDeleted(rec) { return !!(rec && rec.deleted); }

function isOverdue(rec) {
  if (isDeleted(rec)) return false;
  if (rec.flags && typeof rec.flags.overdue === "boolean") return rec.flags.overdue;
  if (isClosedStatus(rec.status)) return false;
  var d = parseDate(rec.data.deliveryDate);
  return !!d && d < todayFromServer();
}

function isUrgent(rec) {
  if (isDeleted(rec)) return false;
  if (rec.flags && typeof rec.flags.urgent === "boolean") return rec.flags.urgent;
  if (isClosedStatus(rec.status)) return false;
  var d = parseDate(rec.data.deliveryDate);
  if (!d) return false;
  var today = todayFromServer();
  var wd = workingDaysBetween(today, d);
  return wd !== null && wd < URGENT_WORKING_DAYS && d >= today;
}

function isPending(rec) {
  if (isDeleted(rec)) return false;
  if (rec.flags && typeof rec.flags.pending === "boolean") return rec.flags.pending;
  return ((rec.data && rec.data.items) || []).some(function (it) { return !itemHasCopy(it); });
}

function hasError(rec) {
  if (isDeleted(rec)) return false;
  if (rec.flags && typeof rec.flags.error === "boolean") return rec.flags.error;
  var d = rec.data || {};
  if (!String(d.name || "").trim() || !String(d.purpose || "").trim() || !d.deliveryDate) return true;
  if (!Array.isArray(d.items) || !d.items.length) return true;
  return d.items.some(function (it) {
    var t = typeOf(it && it.typeId);
    if (!t) return true;
    if (!String(it.name || "").trim()) return true;
    if (t.mode === "normal" && !t.forcePrint && !(it.output || []).length) return true;
    if (itemHasPrint(it) && !String(it.printQty || "").trim()) return true;
    return false;
  });
}

/** 灰階：已刪除、取消、以及逾期且結案。範例案件不套用，永遠維持淺綠底。 */
function isGrey(rec) {
  if (isDeleted(rec)) return true;
  if (rec.isExample) return false;
  if (rec.status === "取消") return true;
  return rec.status === "結案" && !!parseDate(rec.data.deliveryDate) &&
    parseDate(rec.data.deliveryDate) < todayFromServer();
}

/** 卡片底色與互動色：錯誤／退回／取消 > 逾期 > 狀態色。 */
function cardVisualState(rec) {
  if (isDeleted(rec)) return { bgClass: "bg-normal", hover: "var(--line)" };
  if (rec.isExample) return { bgClass: "bg-example", hover: "var(--green)" };
  if (hasError(rec)) return { bgClass: "bg-error", hover: "var(--red)" };
  if (rec.status === "退回" || rec.status === "取消") return { bgClass: "bg-error", hover: "var(--red)" };
  if (isOverdue(rec)) return { bgClass: "bg-overdue", hover: "var(--brand)" };
  return { bgClass: "bg-normal", hover: (STATUS_META[rec.status] || STATUS_META["待確認"]).bg };
}

function applyCardVisual(card, rec) {
  var visual = cardVisualState(rec);
  card.classList.remove("bg-error", "bg-overdue", "bg-normal", "bg-example");
  card.classList.add(visual.bgClass);
  card.classList.toggle("is-grey", isGrey(rec));
  card.classList.toggle("is-deleted", isDeleted(rec));
  card.style.setProperty("--card-hover", visual.hover);
}

   ============================================================ */

function applyUser(user) {
  if (!user || !user.email) throw new Error("帳戶資料未完整回傳。");
  currentUser = {
    name: user.name || user.email,
    email: user.email,
    initials: initialsOf(user.name || user.email),
    isAdmin: user.isAdmin === true
  };
  $("dr-username").textContent = currentUser.name;
  $("dr-avatar").textContent = currentUser.initials || "・";
  AUTH.set(AUTH.token(), { name: currentUser.name, email: currentUser.email, isAdmin: currentUser.isAdmin });
}

function enterApp(user) {
  applyUser(user);
  gate.hidden = true;
  app.hidden = false;
  updateDateLabel();
}

function onGoogleCredential(response) {
  if (response && response.credential) googleCredential = response.credential;
  if (!googleCredential) {
    setLoginStatus("未取得 Google 登入憑證，請重新登入。", true);
    showGoogleButton(true);
    return;
  }
  setLoginStatus("正在驗證帳戶…", false);
  showSlotSpinner();

  apiPost("listRequests", {}, { retries: 1, timeout: 45000 }).then(function (json) {
    setLoginStatus("", false);
    enterApp(json.user || {});
    saveListCache(json);
    applyListPayload(json, true);
  }).catch(function (err) {
    console.error(err);
    if (err && err.code === "AUTH_REQUIRED") {
      googleCredential = "";
      setLoginStatus("Google 登入已逾時，請重新登入。", true);
      showGoogleButton(true);
      return;
    }
    if (RETRYABLE.concat(["DEPLOYMENT_ACCESS"]).indexOf(err.code) >= 0) {
      setLoginStatus(err.message, true);
      showSlotRetry("重新連線", function () { onGoogleCredential({ credential: googleCredential }); });
      return;
    }
    googleCredential = "";
    setLoginStatus("登入失敗：" + (err && err.message ? err.message : "請重新登入。"), true);
    showGoogleButton(true);
  });
}

function startAuth() {
  $("dr-inapp-tip").hidden = !isInAppBrowser();

  if (AUTH.load() && AUTH.user()) {
    // 已在另一頁登入過：直接進入畫面，只顯示清單載入，不再跑一次全頁登入進度。
    enterApp(AUTH.user());
    var painted = paintFromCache(AUTH.user().email);
    loadList(!painted, painted).catch(function () { });
    return;
  }

  if (AUTH.token()) {
    gate.hidden = false;
    showSlotSpinner();
    setLoginStatus("正在恢復登入…", false);
    apiPost("listRequests", {}, { retries: 1, timeout: 45000 }).then(function (json) {
      setLoginStatus("", false);
      enterApp(json.user || {});
      applyListPayload(json, true);
    }).catch(function (err) {
      if (err && err.code === "AUTH_REQUIRED") { showGate(""); return; }
      setLoginStatus(err && err.message ? err.message : "連線暫時沒有回應。", true);
      showSlotRetry("重新連線", startAuth);
    });
    return;
  }

  gate.hidden = false;
  showGoogleButton(false);
}

AUTH.watch(
  function () {
    if (app.hidden) return;
    saveAllOpenDrafts();
    showGate("已在其他分頁登出。");
  },
  function () {
    if (!app.hidden || !AUTH.user()) return;
    enterApp(AUTH.user());
    loadList(false).catch(function () { });
  }
);

$("dr-logout").addEventListener("click", function () {
  var token = AUTH.token();
  if (token) {
    fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "logout", sessionToken: token }),
      cache: "no-store",
      credentials: "omit",
      referrerPolicy: "no-referrer",
      keepalive: true
    }).catch(function () { });
  }
  if (window.google && google.accounts && google.accounts.id) {
    google.accounts.id.disableAutoSelect();
    google.accounts.id.cancel();
  }
  records = [];
  detailCache = Object.create(null);
  openCardId = null;
  currentPage = 1;
  resetArchive();
  clearListCache();
  currentUser = { name: "", email: "", initials: "", isAdmin: false };

});

   系統訊息與清單載入

var systemTimer = 0;

function showSystemMessage(text, isError, autoHide) {
  var bar = $("dr-systembar");
  clearTimeout(systemTimer);
  bar.classList.remove("is-hiding");
  bar.classList.toggle("is-error", !!isError);
  bar.textContent = text;
  if (autoHide) systemTimer = setTimeout(function () { bar.classList.add("is-hiding"); }, 4000);
}

function setListLoading(loading) {
  $("dr-list-loading").hidden = !loading;
  $("dr-filterbar").hidden = !!loading;
  $("dr-summary").hidden = !!loading;
  $("dr-groups").hidden = !!loading;
  if (loading) {
    $("dr-empty").hidden = true;
    $("dr-pager").hidden = true;
  }
}

function applyListPayload(json, resetView, quiet) {
  if (json.user) applyUser(json.user);
  serverNow = json.serverNow ? new Date(json.serverNow) : new Date();

  var next = Array.isArray(json.requests) ? json.requests : [];
  var changed = JSON.stringify(next) !== JSON.stringify(records);

  // 只丟掉內容確實變動過的明細快取，其餘保留以免重新展開時再打一次 API。
  var byId = Object.create(null);
  next.forEach(function (r) { byId[r.id] = r; });
  Object.keys(detailCache).forEach(function (id) {
    var summary = byId[id];
    if (!summary || summary.updatedAt !== detailCache[id].updatedAt) delete detailCache[id];
  });
  records = next;

  $("dr-data-retry").hidden = true;
  setListLoading(false);
  // 先用快取畫出來時不報「已更新」；背景對完發現沒變也不報，避免畫面無故閃動。
  if (!quiet && changed) showSystemMessage("案件清單已更新。", false, true);

  if (resetView !== false) { currentPage = 1; openCardId = null; resetArchive(); }
  populateFilters();
  renderAll();
}

/* ------------------------------------------------------------
   清單本地快取：開頁先用上次的資料立刻畫出來，背景再跟伺服器對一次。
   只是加速顯示，伺服器回來的結果一律覆蓋；登出時清掉。
   ------------------------------------------------------------ */

var LIST_CACHE_KEY = "dr_list_v1";
var LIST_CACHE_MAX_AGE = 24 * 60 * 60 * 1000;

function saveListCache(json) {
  if (!json || !Array.isArray(json.requests)) return;
  try {
    localStorage.setItem(LIST_CACHE_KEY, JSON.stringify({
      at: Date.now(),
      email: (json.user && json.user.email) || (currentUser && currentUser.email) || "",
      payload: json
    }));
  } catch (e) { }
}

function readListCache(email) {
  var raw = null;
  try { raw = localStorage.getItem(LIST_CACHE_KEY); } catch (e) { return null; }
  if (!raw) return null;
  var box = null;
  try { box = JSON.parse(raw); } catch (e) { clearListCache(); return null; }
  if (!box || !box.payload || !Array.isArray(box.payload.requests)) { clearListCache(); return null; }
  if (Date.now() - (box.at || 0) > LIST_CACHE_MAX_AGE) { clearListCache(); return null; }
  if (email && box.email && box.email !== email) { clearListCache(); return null; }
  return box.payload;
}

function clearListCache() {
  try { localStorage.removeItem(LIST_CACHE_KEY); } catch (e) { }
}

/** 有快取就先畫出來，讓畫面不必等伺服器；沒有就維持原本的載入提示。 */
function paintFromCache(email) {
  var cached = readListCache(email);
  if (!cached) return false;
  applyListPayload(cached, true, true);
  return true;
}

function describeError(err) {
  if (!err) return "案件資料暫時無法載入。";
  if (err.code === "TIMEOUT") return "系統回應逾時，請重新載入。";
  if (err.code === "OFFLINE") return "目前沒有網路連線。";
  return err.message || "案件資料暫時無法載入。";
}

function loadList(resetView, quiet) {
  if (!quiet) {
    showSystemMessage("正在載入案件清單…", false, false);
    setListLoading(true);
  }
  $("dr-data-retry").hidden = true;

  return apiPost("listRequests", {}, { retries: 1, timeout: 45000 }).then(function (json) {
    saveListCache(json);
    applyListPayload(json, resetView !== false, quiet);
    return json;
  }).catch(function (err) {
    if (err && err.code === "AUTH_REQUIRED") {
      saveAllOpenDrafts();
      showGate("登入已逾時，請重新登入。");
      throw err;
    }
    setListLoading(false);
    var msg = describeError(err);
    showSystemMessage(msg, true, false);
    $("dr-data-retry-text").textContent = msg;
    $("dr-data-retry").hidden = false;
    throw err;
  });
}

$("dr-data-retry-btn").addEventListener("click", function () { loadList(false).catch(function () { }); });

/* ============================================================
   篩選
   ============================================================ */

var NO_DEPT = "__none__";

/**
 * 部門選項＝固定部門＋一般案件實際出現過的部門，確保任何案件都篩得到。
 * 範例案件不列入選項，也不參與任何篩選。
 */
function deptOptions() {
  var seen = Object.create(null);
  var out = [];
  var hasBlank = false;
  DEPTS.forEach(function (d) { seen[d] = true; out.push(d); });
  records.forEach(function (r) {
    if (r.isExample) return;
    var d = String((r.data && r.data.dept) || "").trim();
    if (!d) { hasBlank = true; return; }
    if (!seen[d]) { seen[d] = true; out.push(d); }
  });
  return { list: out, hasBlank: hasBlank };
}

function populateFilters() {
  var deptSel = $("f-dept");
  var deptValue = deptSel.value;
  var opts = deptOptions();
  deptSel.replaceChildren(el("option", "", "全部部門"));
  deptSel.firstChild.value = "";
  opts.list.forEach(function (d) {
    var o = el("option", "", d);
    o.value = d;
    deptSel.appendChild(o);
  });
  if (opts.hasBlank) {
    var none = el("option", "", "未指定部門");
    none.value = NO_DEPT;
    deptSel.appendChild(none);
  }
  if (Array.prototype.some.call(deptSel.options, function (o) { return o.value === deptValue; })) {
    deptSel.value = deptValue;
  }

  var statusSel = $("f-status");
  var statusValue = statusSel.value;
  statusSel.replaceChildren(el("option", "", "全部狀態"));
  statusSel.firstChild.value = "";
  STATUSES.forEach(function (s) {
    var o = el("option", "", s);
    o.value = s;
    statusSel.appendChild(o);
  });
  if (STATUSES.indexOf(statusValue) >= 0) statusSel.value = statusValue;

  var quick = $("dr-quickchips");
  quick.replaceChildren();
  [["overdue", "逾期"], ["error", "錯誤"]].forEach(function (pair) {
    var c = el("button", "chip c-" + pair[0], pair[1]);
    c.type = "button";
    c.setAttribute("aria-pressed", quickFilter[pair[0]] ? "true" : "false");
    c.addEventListener("click", function () {
      quickFilter[pair[0]] = !quickFilter[pair[0]];
      c.setAttribute("aria-pressed", quickFilter[pair[0]] ? "true" : "false");
      resetArchive();
      currentPage = 1;
      openCardId = null;
      renderAll();
    });
    quick.appendChild(c);
  });
}

function hasActiveFilter() {
  return !!($("f-search").value.trim() || $("f-dept").value || $("f-status").value ||
    quickFilter.overdue || quickFilter.error);
}

function matchesFilter(rec) {
  var q = $("f-search").value.trim().toLowerCase();
  if (q) {
    var hay = (rec.id + " " + (rec.data.name || "") + " " +
      (rec.submitter ? rec.submitter.name + rec.submitter.email : "")).toLowerCase();
    if (hay.indexOf(q) === -1) return false;
  }
  var dept = $("f-dept").value;
  if (dept === NO_DEPT) {
    if (String(rec.data.dept || "").trim()) return false;
  } else if (dept && rec.data.dept !== dept) {
    return false;
  }
  if ($("f-status").value && rec.status !== $("f-status").value) return false;
  // 兩顆快篩為聯集：又逾期又錯誤的案件一定會被選到。
  if (quickFilter.overdue && !isOverdue(rec)) return false;
  if (quickFilter.error && !hasError(rec)) return false;
  return true;
}

function refilter() {
  currentPage = 1;
  openCardId = null;
  resetArchive();
  renderAll();
}

$("f-search").addEventListener("input", refilter);
$("f-dept").addEventListener("change", refilter);
$("f-status").addEventListener("change", refilter);

$("dr-prev").addEventListener("click", function () {
  if (currentPage <= 1) return;
  currentPage--;
  openCardId = null;
  resetArchive();
  renderAll();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

$("dr-next").addEventListener("click", function () {
  currentPage++;
  openCardId = null;
  resetArchive();
  renderAll();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

/* ============================================================
   清單繪製
   ============================================================ */

/** 依送出月份分組，回傳 { key: [rec], ... } 與由新到舊的 key 順序。 */
function groupByMonth(list) {
  var groups = {}, order = [];
  list.forEach(function (r) {
    var d = new Date(r.submittedAt);
    var key = d.getFullYear() + "-" + pad2(d.getMonth() + 1);
    if (!groups[key]) { groups[key] = []; order.push(key); }
    groups[key].push(r);
  });
  return { groups: groups, order: order };
}

function monthGroupNode(title, list) {
  var g = el("div", "month-group");
  g.appendChild(el("h3", "", title));
  var cards = el("div", "cards");
  list.forEach(function (rec) { cards.appendChild(renderCard(rec)); });
  g.appendChild(cards);
  return g;
}

function renderAll() {
  var example = hasActiveFilter()
    ? null
    : (records.find(function (r) { return r && r.isExample; }) || null);
  var list = records.filter(function (r) { return !r.isExample; }).filter(matchesFilter);
  list.sort(function (a, b) { return new Date(b.submittedAt) - new Date(a.submittedAt); });

  /* 統計數字代表全部案件，不受案件區／過往資料的切分影響。 */
  var summary = $("dr-summary");
  summary.replaceChildren();
  [
    ["共", list.length, "筆"],
    ["逾期", list.filter(isOverdue).length, "筆"],
    ["文案待補", list.filter(isPending).length, "筆"]
  ].forEach(function (row) {
    var box = el("div");
    box.appendChild(document.createTextNode(row[0] + " "));
    box.appendChild(el("b", "", String(row[1])));
    box.appendChild(document.createTextNode(" " + row[2]));
    summary.appendChild(box);
  });

  var cutoff = recentCutoff();
  var recent = list.filter(function (r) { return isRecent(r, cutoff); });
  var older = list.filter(function (r) { return !isRecent(r, cutoff); });

  var totalPages = Math.max(1, Math.ceil(recent.length / PAGE_SIZE));
  currentPage = Math.min(Math.max(1, currentPage), totalPages);
  $("dr-pager").hidden = recent.length <= PAGE_SIZE;
  $("dr-pginfo").textContent = "第 " + currentPage + " / " + totalPages + " 頁";
  $("dr-prev").disabled = currentPage <= 1;
  $("dr-next").disabled = currentPage >= totalPages;

  var pageList = recent.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);
  var groupsEl = $("dr-groups");
  groupsEl.replaceChildren();
  /* 案件區沒有結果時要說清楚過往資料裡還有幾筆，否則搜尋會像是查無此案。 */
  var emptyEl = $("dr-empty");
  emptyEl.hidden = pageList.length > 0 || !!example;
  emptyEl.textContent = older.length
    ? "近三個月沒有符合的案件，過往資料中有 " + older.length + " 筆。"
    : "無符合條件的申請單。";

  var byMonth = groupByMonth(pageList);
  byMonth.order.forEach(function (key) {
    var parts = key.split("-");
    groupsEl.appendChild(monthGroupNode(parts[0] + " 年 " + parts[1] + " 月", byMonth.groups[key]));
  });

  if (example) groupsEl.appendChild(monthGroupNode("範例", [example]));

  renderArchive(older);
  syncOpenDim();
}

   過往資料

/**
 * 年 → 月 → 卡片三層，全部預設收合。
 * 卡片只在該月展開時才繪製，收合即丟棄，避免累積上千張卡片。
 */
function renderArchive(older) {
  var box = $("dr-archive");
  var body = $("dr-archive-body");
  var toggle = $("dr-archive-toggle");

  box.hidden = older.length === 0;
  $("dr-archive-count").textContent = hasActiveFilter()
    ? "符合 " + older.length + " 筆"
    : older.length + " 筆";
  toggle.setAttribute("aria-expanded", archiveOpen ? "true" : "false");
  box.classList.toggle("open", archiveOpen);
  body.hidden = !archiveOpen;
  body.replaceChildren();
  if (!archiveOpen || !older.length) return;

  var years = {}, yearOrder = [];
  older.forEach(function (r) {
    var y = String(new Date(r.submittedAt).getFullYear());
    if (!years[y]) { years[y] = []; yearOrder.push(y); }
    years[y].push(r);
  });

  yearOrder.forEach(function (year) {
    var yearOpen = !!archiveOpenKeys[year];
    var yearBox = el("div", "arch-year" + (yearOpen ? " open" : ""));
    yearBox.appendChild(archRow("arch-year-head", year + " 年", years[year].length + " 筆", yearOpen,
      function () { toggleArchiveKey(year); }));

    if (yearOpen) {
      var months = groupByMonth(years[year]);
      var monthWrap = el("div", "arch-months");
      months.order.forEach(function (key) {
        var monthOpen = !!archiveOpenKeys[key];
        var monthBox = el("div", "arch-month" + (monthOpen ? " open" : ""));
        monthBox.appendChild(archRow("arch-month-head",
          key.split("-")[1] + " 月", months.groups[key].length + " 筆", monthOpen,
          function () { toggleArchiveKey(key); }));
        if (monthOpen) {
          var cards = el("div", "cards");
          months.groups[key].forEach(function (rec) { cards.appendChild(renderCard(rec)); });
          monthBox.appendChild(cards);
        }
        monthWrap.appendChild(monthBox);
      });
      yearBox.appendChild(monthWrap);
    }
    body.appendChild(yearBox);
  });
}

function archRow(cls, title, count, open, onToggle) {
  var row = document.createElement("button");
  row.type = "button";
  row.className = cls;
  row.setAttribute("aria-expanded", open ? "true" : "false");
  row.appendChild(el("span", "arch-label", title));
  row.appendChild(el("span", "arch-count", count));
  var caret = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  caret.setAttribute("class", "caret");
  caret.setAttribute("viewBox", "0 0 11 7");
  caret.setAttribute("aria-hidden", "true");
  caret.innerHTML = '<path d="M1 1l4.5 4.5L10 1" stroke="#111" stroke-width="1.6" fill="none"/>';
  row.appendChild(caret);
  row.addEventListener("click", onToggle);
  return row;
}

function toggleArchiveKey(key) {
  if (archiveOpenKeys[key]) delete archiveOpenKeys[key];
  else archiveOpenKeys[key] = true;
  renderAll();
}

$("dr-archive-toggle").addEventListener("click", function () {
  archiveOpen = !archiveOpen;
  if (!archiveOpen) archiveOpenKeys = Object.create(null);
  renderAll();
});

function syncOpenDim() {
  var open = !!document.querySelector(".cardhost .card.open");
  document.querySelectorAll(".cardhost").forEach(function (host) {
    host.classList.toggle("has-open", open);
  });
}

function statusPillNode(rec) {
  var meta = STATUS_META[rec.status] || STATUS_META["待確認"];
  var pill = el("span", "status-pill", rec.status);
  pill.style.background = rec.isExample ? "var(--green)" : meta.bg;
  pill.style.color = rec.isExample ? "var(--ink)" : meta.fg;
  return pill;
}

function buildCardMarks(rec) {
  var marks = el("div", "card-marks");

  if (isDeleted(rec)) {
    var when = rec.deletedAt ? fmtDate(new Date(rec.deletedAt)) : "";
    marks.appendChild(el("div", "deleted-note",
      "已由 " + (rec.deletedBy || "未知帳戶") + (when ? " 於 " + when : "") + " 刪除"));
    return marks;
  }

  if (isOverdue(rec)) marks.appendChild(el("span", "badge lv2 overdue", "逾期"));
  else if (isUrgent(rec)) marks.appendChild(el("span", "badge lv2 urgent", "急件"));

  if (rec.isExample) {
    marks.appendChild(el("span", "badge lv2 example", "範例"));
  } else {
    var pend = isPending(rec);
    marks.appendChild(el("span", "badge lv2 copy-state " + (pend ? "pending" : "ready"),
      pend ? "文案待補" : "文案已提供"));
  }

  marks.appendChild(statusPillNode(rec));
  return marks;
}

function renderCard(rec) {
  var card = el("div", "card");
  card.dataset.id = rec.id;
  applyCardVisual(card, rec);
  var deleted = isDeleted(rec);
  var isOpen = !deleted && openCardId === rec.id;
  if (isOpen) card.classList.add("open");

  var top = el("div", "card-top");
  top.appendChild(el("div", "idcode", rec.id || ""));
  top.appendChild(el("div", "cname", (rec.data && rec.data.name) || "未命名"));

  var meta = el("div", "cmeta");
  meta.appendChild(el("span", "meta-dept",
    ((rec.data && rec.data.dept) || (rec.submitter ? rec.submitter.name : "") || "") + " ・ "));
  meta.appendChild(document.createTextNode(fmtDate(new Date(rec.submittedAt))));
  top.appendChild(meta);

  top.appendChild(buildCardMarks(rec));

  if (!deleted) {
    var caret = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    caret.setAttribute("class", "caret");
    caret.setAttribute("viewBox", "0 0 11 7");
    caret.setAttribute("aria-hidden", "true");
    caret.innerHTML = '<path d="M1 1l4.5 4.5L10 1" stroke="#111" stroke-width="1.6" fill="none"/>';
    top.appendChild(caret);
  }
  card.appendChild(top);

  var detail = el("div", "card-detail");
  card.appendChild(detail);

  if (deleted) {
    top.setAttribute("aria-disabled", "true");
    return card;
  }

  var built = false;
  function ensureDetail() {
    if (built) return;
    built = true;
    if (detailCache[rec.id]) {
      buildDetail(JSON.parse(JSON.stringify(detailCache[rec.id])), detail);
      return;
    }
    detail.replaceChildren(el("div", "detail-loading", "正在載入案件內容…"));
    apiPost("getRequest", { requestId: rec.id }, { retries: 1, timeout: 30000 }).then(function (result) {
      if (!result.request) throw new Error("案件內容不存在。");
      detailCache[rec.id] = JSON.parse(JSON.stringify(result.request));
      buildDetail(JSON.parse(JSON.stringify(result.request)), detail);
    }).catch(function (err) {
      built = false;
      if (err && err.code === "AUTH_REQUIRED") {
        detail.replaceChildren(el("div", "detail-loading", "登入已逾時，重新登入後可繼續。"));
        showGate("登入已逾時，請重新登入。");
        return;
      }
      detail.replaceChildren(el("div", "detail-loading", "載入失敗：" + err.message));
    });
  }

  top.setAttribute("role", "button");
  top.setAttribute("tabindex", "0");
  top.setAttribute("aria-expanded", isOpen ? "true" : "false");

  function toggle() {
    var willOpen = !card.classList.contains("open");
    if (willOpen) {
      document.querySelectorAll(".cardhost .card.open").forEach(function (x) {
        saveDetailDraftOf(x);
        x.classList.remove("open");
        var t = x.querySelector(".card-top");
        if (t) t.setAttribute("aria-expanded", "false");
      });
    } else {
      saveDetailDraftOf(card);
    }
    card.classList.toggle("open", willOpen);
    top.setAttribute("aria-expanded", willOpen ? "true" : "false");
    openCardId = willOpen ? rec.id : null;
    if (willOpen) ensureDetail();
    syncOpenDim();
  }

  top.addEventListener("click", toggle);
  top.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
  });

  if (isOpen) ensureDetail();
  return card;
}

/**
 * 只放行 http／https，缺通訊協定時補上 https://。
 * 其餘一律視為無效，避免 javascript: 之類的網址被點開。
 */
function safeHref(value) {
  var text = String(value || "").trim();
  if (!text) return "";
  if (!/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(text)) text = "https://" + text;
  var url;
  try { url = new URL(text); } catch (e) { return ""; }
  if (url.protocol !== "http:" && url.protocol !== "https:") return "";
  if (!url.hostname || url.hostname.indexOf(".") < 0) return "";
  return url.href;
}

/* ============================================================
   未儲存編輯的本地暫存
   ============================================================ */

var DETAIL_DRAFT_PREFIX = "dr_detail_v1_";
var DETAIL_DRAFT_MAX_AGE = 12 * 60 * 60 * 1000;
var openDetailControllers = Object.create(null);

function detailDraftKey(id) { return DETAIL_DRAFT_PREFIX + id; }

function readDetailDraft(id) {
  var raw = null;
  try { raw = sessionStorage.getItem(detailDraftKey(id)); } catch (e) { return null; }
  if (!raw) return null;
  try {
    var p = JSON.parse(raw);
    if (!p || !p.savedAt || Date.now() - p.savedAt > DETAIL_DRAFT_MAX_AGE) {
      clearDetailDraft(id);
      return null;
    }
    return p;
  } catch (e) { return null; }
}

function writeDetailDraft(id, payload) {
  try {
    sessionStorage.setItem(detailDraftKey(id), JSON.stringify({
      data: payload.data, status: payload.status, meetingDate: payload.meetingDate, savedAt: Date.now()
    }));
  } catch (e) { }
}

function clearDetailDraft(id) {
  try { sessionStorage.removeItem(detailDraftKey(id)); } catch (e) { }
}

function saveDetailDraftOf(cardEl) {
  var id = cardEl && cardEl.dataset ? cardEl.dataset.id : "";
  var controller = id ? openDetailControllers[id] : null;
  if (controller) controller.persist();
}

function saveAllOpenDrafts() {
  Object.keys(openDetailControllers).forEach(function (id) {
    openDetailControllers[id].persist();
  });
}

window.addEventListener("pagehide", saveAllOpenDrafts, { passive: true });
document.addEventListener("visibilitychange", function () {
  if (document.hidden) saveAllOpenDrafts();
}, { passive: true });

function labelNode(text, required, optText) {
  var lab = el("label");
  lab.appendChild(document.createTextNode(text));
  if (required === true) lab.appendChild(el("span", "req", "*"));
  else if (required === false) lab.appendChild(el("span", "opt", optText || "選填"));
  return lab;
}

/** 文字欄位一律是可換行、可拉高的多行欄位；日期與數量維持原生控制項。 */
function textEntry(value, onChange, cls) {
  var input = document.createElement("textarea");
  if (cls) input.className = cls;
  input.value = value || "";
  input.addEventListener("input", function () { onChange(input.value); });
  return input;
}

function makeField(kind, label, required, value, onChange, optText) {
  var f = el("div", "field");
  f.appendChild(labelNode(label, required, optText));

  if (kind === "date") {
    var wrap = el("div", "date-wrap");
    var dateInput = document.createElement("input");
    dateInput.type = "date";
    dateInput.value = value || "";
    dateInput.addEventListener("input", function () { onChange(dateInput.value); });
    wrap.appendChild(dateInput);
    f.appendChild(wrap);
    return f;
  }

  if (kind === "number") {
    var numInput = document.createElement("input");
    numInput.type = "number";
    numInput.min = "0";
    numInput.value = value || "";
    numInput.addEventListener("input", function () { onChange(numInput.value); });
    f.appendChild(numInput);
    return f;
  }

  var entry = textEntry(value, onChange, kind === "textarea" ? "" : "h1");
  if (kind === "url") entry.inputMode = "url";
  f.appendChild(entry);
  return f;
}

function newItemData() {
  return {
    _id: "it" + Date.now() + Math.random().toString(16).slice(2),
    name: "", typeId: "", output: [], sizeRows: [{ purpose: "", customText: "", px: "" }],
    printQty: "", exposure: "", exposureModel: "",
    copy: { head: "", sub: "", small: "", other: "" },
    channel: "", useDate: "", cta: "", note: "", page: "",
    blocks: [{ _id: "bk" + Date.now() + Math.random().toString(16).slice(2), head: "", sub: "", small: "", other: "", imgNote: "", link: "" }]
  };
}

function normalizeItem(item) {
  if (!item) return;
  var t = typeOf(item.typeId);
  var seen = Object.create(null), out = [];
  (Array.isArray(item.output) ? item.output : []).forEach(function (v) {
    if ((v === "digital" || v === "print") && !seen[v]) { seen[v] = true; out.push(v); }
  });
  if (t && t.forcePrint) out = ["print"];
  if (t && (t.mode === "structure" || t.mode === "notice")) out = [];
  item.output = out;
  item.sizeRows = Array.isArray(item.sizeRows) ? item.sizeRows : [];
  item.blocks = Array.isArray(item.blocks) ? item.blocks : [];
  item.copy = item.copy && typeof item.copy === "object" ? item.copy : { head: "", sub: "", small: "", other: "" };
  if (t && t.mode === "structure" && !item.blocks.length) {
    item.blocks.push({ _id: "bk" + Date.now() + Math.random().toString(16).slice(2), head: "", sub: "", small: "", other: "", imgNote: "", link: "" });
  }
}

function itemBadgeNodes(item) {
  var frag = document.createDocumentFragment();
  var t = typeOf(item && item.typeId);
  if (!t) return frag;
  if (t.forcePrint) {
    frag.appendChild(el("span", "badge lv2 print", "印刷"));
  } else if (t.mode !== "notice" && t.mode !== "structure") {
    if (itemHasDigital(item)) frag.appendChild(el("span", "badge lv2 digital", "數位"));
    if (itemHasPrint(item)) frag.appendChild(el("span", "badge lv2 print", "印刷"));
  }
  if (t.mode !== "notice") {
    frag.appendChild(itemHasCopy(item)
      ? el("span", "badge lv2 ready", "文案已提供")
      : el("span", "badge lv2 pending", "文案待補"));
  }
  return frag;
}

function buildDetail(record, container) {
  var work = JSON.parse(JSON.stringify(record));
  if (typeof work.meetingDate !== "string") work.meetingDate = "";
  (work.data.items || []).forEach(normalizeItem);

  var serverData = JSON.stringify(work.data);
  var serverStatus = work.status;
  var serverMeeting = work.meetingDate;

  // 還原本機未儲存的編輯（重整、切頁、重新登入都會回到原本的編輯內容）
  var draft = readDetailDraft(work.id);
  var restoredFromDraft = false;
  if (draft && canEditRecord(work)) {
    if (JSON.stringify(draft.data) !== serverData || draft.status !== serverStatus || draft.meetingDate !== serverMeeting) {
      work.data = draft.data;
      work.status = draft.status;
      work.meetingDate = draft.meetingDate;
      (work.data.items || []).forEach(normalizeItem);
      restoredFromDraft = true;
    } else {
      clearDetailDraft(work.id);
    }
  }

  var canEdit = canEditRecord(work);
  var canOperate = canOperateRecord(work);
  var canWord = canSendWord(work);

  var logBox = null, logPanel = null, statusChips = null, statusEl = null;
  var actionBusy = false, actionButtons = [], flashTimer = 0;
  var saveOpId = "", resendOpId = "", wordOpId = "", deleteOpId = "";

  function isDirty() {
    return JSON.stringify(work.data) !== serverData ||
      work.status !== serverStatus ||
      work.meetingDate !== serverMeeting;
  }

  function persist() {
    if (!canEdit) return;
    if (isDirty()) writeDetailDraft(work.id, work);
    else clearDetailDraft(work.id);
  }

  /** 動作列只有一行狀態文字：平時顯示是否有未儲存變更，動作後暫時顯示結果。 */
  function renderStatus() {
    if (!statusEl) return;
    if (isDirty()) {
      statusEl.textContent = "有尚未儲存的變更。";
      statusEl.classList.add("show");
    } else {
      statusEl.textContent = "";
      statusEl.classList.remove("show");
    }
  }

  function markDirty() {
    clearTimeout(flashTimer);
    renderStatus();
    persist();
  }

  openDetailControllers[work.id] = { persist: persist };

  function stamp(d) {
    return d.getFullYear() + "/" + pad2(d.getMonth() + 1) + "/" + pad2(d.getDate()) +
      " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  }

  function logText(entry) {
    return stamp(new Date(entry.time)) + "　" +
      initialsOf((entry.user || "").split("@")[0].replace(/[._-]+/g, " ")) +
      "<" + entry.user + ">　" + (entry.text || "內容更新");
  }

  function prependLog(entry) {
    if (!logBox) return;
    var node = el("div", "entry", logText(entry));
    if (logBox.firstChild) logBox.insertBefore(node, logBox.firstChild);
    else logBox.appendChild(node);
    if (logPanel) logPanel.hidden = false;
  }

  function flash(msg) {
    if (!statusEl) return;
    clearTimeout(flashTimer);
    statusEl.textContent = msg;
    statusEl.classList.add("show");
    flashTimer = setTimeout(renderStatus, 2600);
  }

  function updateCardChrome() {
    var cardEl = container.closest(".card");
    if (!cardEl) return;
    applyCardVisual(cardEl, work);
    var top = cardEl.querySelector(".card-top");
    if (!top) return;
    var oldMarks = top.querySelector(".card-marks");
    if (oldMarks) top.replaceChild(buildCardMarks(work), oldMarks);
    var cname = top.querySelector(".cname");
    if (cname) cname.textContent = work.data.name || "未命名";
  }

  function applyMutationResult(result) {
    var previousLogs = (work.log || []).slice();
    if (result.request) {
      work = JSON.parse(JSON.stringify(result.request));
      work.log = previousLogs;
      (work.data.items || []).forEach(normalizeItem);
    }
    (result.logs || []).forEach(function (entry) {
      work.log.push(entry);
      prependLog(entry);
    });
    detailCache[work.id] = JSON.parse(JSON.stringify(work));
    if (result.summary) {
      var idx = records.findIndex(function (x) { return x.id === work.id; });
      if (idx >= 0) records[idx] = JSON.parse(JSON.stringify(result.summary));
    }
    serverData = JSON.stringify(work.data);
    serverStatus = work.status;
    serverMeeting = work.meetingDate;
    clearDetailDraft(work.id);
    canEdit = canEditRecord(work);
    canOperate = canOperateRecord(work);
    canWord = canSendWord(work);
    updateCardChrome();
  }

  function collectErrors() {
    var errors = [];
    function add(label, sel) { errors.push({ label: label, sel: sel }); }

    if (!String(work.data.name || "").trim()) add("需求名稱", ".request-name-field");
    if (!String(work.data.purpose || "").trim()) add("需求背景／說明", ".purpose-field");
    if (!String(work.data.deliveryDate || "").trim()) add("總交付日", ".delivery-field");
    if (!Array.isArray(work.data.items) || !work.data.items.length) add("設計項目", null);

    (work.data.items || []).forEach(function (it, idx) {
      var prefix = "項目 " + (idx + 1);
      var scope = '[data-item-index="' + idx + '"] ';
      if (!String(it.name || "").trim()) add(prefix + "：項目名稱", scope + ".item-name-field");
      if (!it.typeId) { add(prefix + "：需求類型", scope + ".item-type-field"); return; }
      var t = typeOf(it.typeId);
      if (!t || t.mode === "notice" || t.mode === "structure") return;
      normalizeItem(it);
      if (!t.forcePrint && !it.output.length) add(prefix + "：輸出形式", scope + ".item-output-field");
      if (itemHasPrint(it) && !String(it.printQty || "").trim()) add(prefix + "：數量", scope + ".item-qty-field");
    });
    return errors;
  }

  function clearFieldErrors() {
    container.querySelectorAll(".field.err").forEach(function (n) { n.classList.remove("err"); });
  }

  function guardRequired() {
    var errors = collectErrors();
    clearFieldErrors();
    if (!errors.length) return true;
    errors.forEach(function (e) {
      if (!e.sel) return;
      var node = container.querySelector(e.sel);
      if (node) node.classList.add("err");
    });
    var labels = errors.map(function (e) { return e.label; });
    flash("必填未完成：" + labels.slice(0, 3).join("、") + (labels.length > 3 ? "…" : ""));
    var first = container.querySelector(".field.err");
    if (first) first.scrollIntoView({ behavior: "smooth", block: "center" });
    return false;
  }

  // 一開始補填就把紅框拿掉，行為與申請表一致

  var btnSave = makeActionButton("primary", "儲存");
  btnSave.addEventListener("click", async function () {
    if (!guardRequired() || actionBusy) return;
    actionBusy = true;
    setActionLoading(btnSave, true);
    try {
      var labels = [];
      if (work.status !== serverStatus) labels.push(work.status);
      if (JSON.stringify(work.data) !== serverData || work.meetingDate !== serverMeeting) labels.push("內容更新");
      if (!labels.length) labels.push("內容更新");
      if (!saveOpId) saveOpId = makeOperationId();

      var result = await apiPost("updateRequest", buildPayload(labels, saveOpId), { timeout: 45000 });
      saveOpId = "";
      applyMutationResult(result);
      flash(work.isExample && !currentUser.isAdmin
        ? "已儲存。範例案件會在每天凌晨復原。"
        : "已儲存。");
    } catch (err) {
      if (!handleAuthError(err)) flash("儲存失敗：" + err.message);

    actionBusy = true;
    setActionLoading(btnResend, true);

      var labels = [];
      if (work.status !== "待確認") { setStatus("待確認"); labels.push("待確認"); }

      var result = await apiPost("resendRequest", buildPayload(labels, resendOpId), { timeout: 60000 });

      applyMutationResult(result);

      delete openDetailControllers[work.id];
      var idx = records.findIndex(function (x) { return x.id === work.id; });

function disableInputs(root) {
  root.querySelectorAll("input,textarea,select,button").forEach(function (node) {
    node.disabled = true;

}

/* ---------- 項目編輯 ---------- */

function buildItemBlock(item, idx, onStructuralChange, onDelete, onChange) {
  var box = el("div", "item-block");
  box.dataset.itemIndex = String(idx);

  var bar = el("div", "item-bar");
  bar.appendChild(el("div", "idx", String(idx + 1)));
  var badges = el("div", "badges");
  badges.appendChild(itemBadgeNodes(item));
  bar.appendChild(badges);
  box.appendChild(bar);

  function refreshBadges() {
    badges.replaceChildren(itemBadgeNodes(item));
    var primaries = box.querySelectorAll(".copy-primary-field");
    primaries.forEach(function (f) { f.classList.remove("copy-pending-target"); });
    if (!itemHasCopy(item) && primaries.length) primaries[0].classList.add("copy-pending-target");
  }

  var headRow = el("div", "row item-head-row");
  var nameField = makeField("text", "項目名稱", true, item.name, function (v) {
    item.name = v; onChange();
  });
  nameField.classList.add("item-name-field");
  headRow.appendChild(nameField);

  var typeField = el("div", "field item-type-field");
  typeField.appendChild(labelNode("需求類型", true));
  var sel = document.createElement("select");
  sel.appendChild(el("option", "", "請選擇"));
  TYPES.forEach(function (t) {
    var o = el("option", "", t.label);
    o.value = t.id;
    if (item.typeId === t.id) o.selected = true;
    sel.appendChild(o);
  });
  sel.addEventListener("change", function () {
    item.typeId = sel.value;
    var t = typeOf(item.typeId);
    item.sizeRows = [{ purpose: "", customText: "", px: "" }];
    item.output = (t && t.forcePrint) ? ["print"] : [];
    normalizeItem(item);
    applyDefaultSize(item);
    onStructuralChange();
    onChange();
  });
  typeField.appendChild(sel);
  headRow.appendChild(typeField);
  box.appendChild(headRow);

  var t = typeOf(item.typeId);
  if (t) {
    if (t.mode === "notice") {
      box.appendChild(el("div", "notice-box", t.notice));
    } else if (t.mode === "structure") {
      var list = el("div", "blocks");
      item.blocks.forEach(function (block, bi) {
        var b = el("div", "block");
        b.appendChild(el("div", "block-title", "區塊 " + (bi + 1)));

        var c4 = el("div", "copy4");
        [["head", "大標"], ["sub", "副標"], ["small", "小字"], ["other", "其他"]].forEach(function (pair, i) {
          var f = makeField("text", pair[1], null, block[pair[0]], function (v) {
            block[pair[0]] = v; refreshBadges(); onChange();
          });
          if (i === 0) f.classList.add("copy-primary-field");
          c4.appendChild(f);
        });
        b.appendChild(c4);

        b.appendChild(makeField("text", "畫面需求備註", null, block.imgNote, function (v) {
          block.imgNote = v; onChange();
        }));
        b.appendChild(makeField("text", "CTA／連結", null, block.link, function (v) {
          block.link = v; onChange();
        }));

        var footer = el("div", "block-footer");
        var del = el("button", "del-line", "刪除區塊");
        del.type = "button";
        del.disabled = item.blocks.length <= 1;
        del.addEventListener("click", function () {
          if (item.blocks.length <= 1) return;
          item.blocks = item.blocks.filter(function (x) { return x !== block; });
          onStructuralChange();
          onChange();
        });
        footer.appendChild(del);

        var order = el("div", "block-order");
        var up = el("button", "", "↑");
        up.type = "button";
        up.setAttribute("aria-label", "上移區塊");
        up.disabled = bi === 0;
        up.addEventListener("click", function () {
          if (bi === 0) return;
          var a = item.blocks, tmp = a[bi - 1];
          a[bi - 1] = a[bi]; a[bi] = tmp;
          onStructuralChange();
          onChange();
        });
        var down = el("button", "", "↓");
        down.type = "button";
        down.setAttribute("aria-label", "下移區塊");
        down.disabled = bi === item.blocks.length - 1;
        down.addEventListener("click", function () {
          if (bi === item.blocks.length - 1) return;
          var a = item.blocks, tmp = a[bi + 1];
          a[bi + 1] = a[bi]; a[bi] = tmp;
          onStructuralChange();
          onChange();
        });
        order.appendChild(up);
        order.appendChild(down);
        footer.appendChild(order);
        b.appendChild(footer);
        list.appendChild(b);
      });
      box.appendChild(list);

      var addBlk = el("button", "add-line", "＋ 新增區塊");
      addBlk.type = "button";
      addBlk.style.marginTop = "12px";
      addBlk.addEventListener("click", function () {
        item.blocks.push({ _id: "bk" + Date.now(), head: "", sub: "", small: "", other: "", imgNote: "", link: "" });
        onStructuralChange();
        onChange();
      });
      box.appendChild(addBlk);
      box.appendChild(el("div", "block-stat", "自動統計：" + item.blocks.length + " 個區塊"));

      var dateRow = el("div", "row c2");
      dateRow.appendChild(makeField("date", "交付日", false, item.useDate, function (v) {
        item.useDate = v; onChange();
      }));
      dateRow.appendChild(el("div", "field"));
      box.appendChild(dateRow);
    } else {
      if (!t.forcePrint) {
        var outField = el("div", "field item-output-field");
        outField.appendChild(labelNode("輸出形式", true));
        var outRow = el("div", "chiprow");
        [["digital", "數位"], ["print", "印刷"]].forEach(function (pair) {
          var chip = el("button", "chip c-" + pair[0], pair[1]);
          chip.type = "button";
          chip.setAttribute("aria-pressed", item.output.indexOf(pair[0]) >= 0 ? "true" : "false");
          chip.addEventListener("click", function () {
            var i = item.output.indexOf(pair[0]);
            if (i >= 0) item.output.splice(i, 1); else item.output.push(pair[0]);
            normalizeItem(item);
            onStructuralChange();
            onChange();
          });
          outRow.appendChild(chip);
        });
        outField.appendChild(outRow);
        box.appendChild(outField);
      }

      if (t.extra && t.extra.indexOf("page") >= 0) {
        box.appendChild(makeField("text", "素材應用處", false, item.page, function (v) {
          item.page = v; onChange();
        }));
      }

      var options = sizeOptionsFor(item, t);
      if (options.length) {
        var sizeWrap = el("div", "field");
        sizeWrap.appendChild(labelNode("尺寸", false, "選填，除印刷品外若留白將由設計端評估。"));
        if (!item.sizeRows.length) item.sizeRows.push({ purpose: "", customText: "", px: "" });

        item.sizeRows.forEach(function (row) {
          var r = el("div", "size-row");
          var purposeField = el("div", "field");

          if (row.purpose === "__custom__") {
            var cw = el("div", "custom-purpose");
            cw.appendChild(el("span", "prefix", "自訂："));
            var ci = document.createElement("input");
            ci.type = "text";
            ci.placeholder = "輸入用途名稱";
            ci.value = row.customText || "";
            ci.addEventListener("input", function () { row.customText = ci.value; onChange(); });
            cw.appendChild(ci);
            var back = el("button", "inline-clear", "✕");
            back.type = "button";
            back.setAttribute("aria-label", "取消自訂用途");
            back.addEventListener("click", function () {
              row.purpose = ""; row.customText = ""; row.px = "";
              onStructuralChange();
              onChange();
            });
            cw.appendChild(back);
            purposeField.appendChild(cw);
          } else {
            var s = document.createElement("select");
            s.appendChild(el("option", "", "用途／版位"));
            options.forEach(function (opt) {
              var o = el("option", "", opt.label);
              o.value = opt.custom ? "__custom__" : opt.label;
              if (row.purpose === o.value) o.selected = true;
              s.appendChild(o);
            });
            s.addEventListener("change", function () {
              row.purpose = s.value;
              if (row.purpose !== "__custom__") {
                var def = null;
                for (var i = 0; i < options.length; i++) {
                  if (options[i].label === row.purpose) { def = options[i]; break; }
                }
                row.px = sizeValueOf(def);
              }
              onStructuralChange();
              onChange();
            });
            purposeField.appendChild(s);
          }
          r.appendChild(purposeField);

          var pxField = el("div", "field");
          var frozen = false;
          if (row.purpose && row.purpose !== "__custom__") {
            for (var j = 0; j < options.length; j++) {
              if (options[j].label === row.purpose) { frozen = !!(options[j].w || options[j].note); break; }
            }
          }
          var pxi = textEntry(row.px, function (v) { row.px = v; onChange(); }, "h1");
          pxi.placeholder = "實際尺寸";
          if (frozen) {
            pxi.disabled = true;
            pxi.classList.add("readonly");
          }
          pxField.appendChild(pxi);

          var group = el("div", "size-value-group");
          group.appendChild(pxField);
          var rm = el("button", "rm", "✕");
          rm.type = "button";
          rm.setAttribute("aria-label", "刪除此尺寸");
          rm.disabled = item.sizeRows.length <= 1;
          rm.addEventListener("click", function () {
            if (item.sizeRows.length <= 1) return;
            item.sizeRows = item.sizeRows.filter(function (x) { return x !== row; });
            onStructuralChange();
            onChange();
          });
          group.appendChild(rm);
          r.appendChild(group);
          sizeWrap.appendChild(r);
        });

        var addSize = el("button", "add-line", "＋ 新增尺寸");
        addSize.type = "button";
        addSize.addEventListener("click", function () {
          item.sizeRows.push({ purpose: "", customText: "", px: "" });
          onStructuralChange();
          onChange();
        });
        sizeWrap.appendChild(addSize);
        box.appendChild(sizeWrap);
      }

      if (itemHasPrint(item)) {
        var qtyField = makeField("number", "數量", true, item.printQty, function (v) {
          item.printQty = v; onChange();
        });
        qtyField.classList.add("item-qty-field");
        box.appendChild(qtyField);
      }

      var expField = el("div", "field");
      expField.appendChild(labelNode("商品曝光", false));
      var expRow = el("div", "chiprow");
      [["reveal", "露出商品"], ["free", "不限"]].forEach(function (pair) {
        var chip = el("button", "chip", pair[1]);
        chip.type = "button";
        chip.setAttribute("aria-pressed", item.exposure === pair[0] ? "true" : "false");
        chip.addEventListener("click", function () {
          item.exposure = item.exposure === pair[0] ? "" : pair[0];
          if (item.exposure !== "reveal") item.exposureModel = "";
          onStructuralChange();
          onChange();
        });
        expRow.appendChild(chip);
      });
      expField.appendChild(expRow);
      box.appendChild(expField);

      if (item.exposure === "reveal") {
        box.appendChild(makeField("text", "商品型號", false, item.exposureModel, function (v) {
          item.exposureModel = v; onChange();
        }));
      }

      var copyWrap = el("div", "field");
      copyWrap.appendChild(labelNode("文案", false, "選填，留白則標記為文案待補。"));
      var c4b = el("div", "copy4");
      [["head", "大標"], ["sub", "副標"], ["small", "小字"], ["other", "其他"]].forEach(function (pair, i) {
        var f = makeField("text", pair[1], null, item.copy[pair[0]], function (v) {
          item.copy[pair[0]] = v; refreshBadges(); onChange();
        });
        if (i === 0) f.classList.add("copy-primary-field");
        c4b.appendChild(f);
      });
      copyWrap.appendChild(c4b);
      box.appendChild(copyWrap);

      var deliveryRow = el("div", "row c2");
      if (t.showChannel) {
        deliveryRow.appendChild(makeField("text", "使用位置", false, item.channel, function (v) {
          item.channel = v; onChange();
        }));
      }
      deliveryRow.appendChild(makeField("date", "交付日", false, item.useDate, function (v) {
        item.useDate = v; onChange();
      }));
      if (!t.showChannel) deliveryRow.appendChild(el("div", "field"));
      box.appendChild(deliveryRow);

      box.appendChild(makeField("text", "CTA／連結", false, item.cta, function (v) {
        item.cta = v; onChange();
      }));
    }

    if (t.mode !== "notice") {
      box.appendChild(makeField("textarea", "項目備註", false, item.note, function (v) {
        item.note = v; onChange();
      }));
    }
  }

  var footer = el("div", "item-delete-footer");
  var delItem = el("button", "del-line", "刪除此項目");
  delItem.type = "button";
  delItem.addEventListener("click", onDelete);
  footer.appendChild(delItem);
  box.appendChild(footer);

  refreshBadges();
  return box;
}

/* ============================================================
   啟動
   ============================================================ */

initTouchFeedback(".btn-topbar,.btn-sm,.pgbtn,.chip,.card-top,.subpanel,.item-block,.block,.add-line,.del-line,.rm,.inline-clear,.block-order button,.custom-purpose,input,textarea,select,.data-retry button");
startHeartbeat();
startAuth();

})();
</script>
</body>
</html>
