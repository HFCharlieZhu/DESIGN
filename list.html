<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>允禾發 設計需求表</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans:wght@400;500;700&display=swap">
<style>
:root{color-scheme:light;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:#eeeeee;}
#dr-app{
  --brand:#f8b500; --brand-l:#fff3d1; --brand-dk:#d39a00; 
  --ink:#111111; --body:#666666; --muted:#9fa0a0;
  --line:#bababa; --hair:#d8d6d0;
  --paper:#ffffff; --tint:#eeeeee;
  --blue:#4AACFE; --blue-l:#e5f4ff;
  --brown:#AC6A27;
  --green:#8CCDB8; --green-l:#e3f5ee;
  --red:#ef8585; --red-l:#fbe3e3;
  --yellow-l:#fff3d1;
  --grey-inv:#d8d8d8;
  --r:8px; --shadow:4px 4px 6px rgba(0,0,0,.15);
  --ease:.18s;
  font-family:'Noto Sans TC','Noto Sans',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  color:var(--ink); background:var(--tint);
  min-height:100vh; line-height:1.7; letter-spacing:.02em;
  -webkit-font-smoothing:antialiased;
}
#dr-app *{box-sizing:border-box;}
#dr-app .wrap{max-width:1040px;margin:0 auto;padding:0 20px 80px;}

#dr-app .topbar{
  background:rgba(255,255,255,.55); -webkit-backdrop-filter:blur(15px); backdrop-filter:blur(15px);
  border-bottom:1.2px solid var(--hair);
  position:sticky;top:0;z-index:50;
}
#dr-app .topbar-in{max-width:1040px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:12px;}
#dr-app .topbar-title{font-weight:900;font-size:16px;letter-spacing:.04em;flex:0 0 auto;}
#dr-app .topbar-kind{font-weight:500;font-size:12px;color:var(--body);margin-left:8px;letter-spacing:.06em;}
#dr-app .btn-link{border:0;background:none;color:var(--body);font-size:12px;cursor:pointer;text-decoration:underline;font-family:inherit;padding:0;}
#dr-app .topbar-sub{font-size:12px;color:var(--muted);flex:1 1 auto;}
#dr-app .topbar-user{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--body);flex:0 0 auto;}
#dr-app .avatar{width:26px;height:26px;border-radius:50%;background:var(--brand);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:0 0 auto;}

#dr-app .btn-topbar{flex:0 0 auto;height:34px;padding:0 18px;border-radius:999px;border:1px solid var(--brand);background:var(--brand);color:var(--ink);font-family:inherit;font-size:13px;font-weight:700;letter-spacing:.04em;cursor:pointer;display:inline-flex;align-items:center;text-decoration:none;transition:filter var(--ease),transform var(--ease);}
#dr-app .btn-topbar:hover{filter:brightness(.95);transform:scale(1.02);}
#dr-app .devbadge{background:#eef2f5;border-bottom:1px solid var(--hair);text-align:center;font-size:12px;color:var(--body);padding:6px 12px;}

#dr-app .filterbar{background:var(--paper);border:1.2px solid var(--line);border-radius:var(--r);padding:16px;margin:16px 0;}
#dr-app .filterrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
#dr-app .filterrow input[type=text]{flex:1 1 220px;min-width:160px;}
#dr-app .filterrow select{flex:0 0 auto;width:auto;min-width:120px;}
#dr-app input[type=text],#dr-app select,#dr-app textarea,#dr-app input[type=date],#dr-app input[type=number]{
  font-family:inherit;font-size:13.5px;color:var(--ink);background:var(--paper);
  border:1.2px solid var(--line);border-radius:var(--r);padding:9px 12px;outline:none;transition:border-color var(--ease);
}
#dr-app input:hover,#dr-app select:hover,#dr-app textarea:hover{border-color:var(--brand);}
#dr-app input:focus,#dr-app select:focus,#dr-app textarea:focus{border-color:var(--brand);}
#dr-app select{appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='11' height='7'><path d='M1 1l4.5 4.5L10 1' stroke='%23111' stroke-width='1.6' fill='none'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;padding-right:30px;}
#dr-app .chiprow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}

#dr-app .statuschip{height:30px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-family:inherit;font-size:12.5px;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;transition:background-color var(--ease),border-color var(--ease),color var(--ease);}
#dr-app .statuschip.overdue:hover{border-color:var(--brand);}
#dr-app .statuschip.error:hover{border-color:var(--red);}
#dr-app .statuschip[aria-pressed="true"]{border-color:transparent;font-weight:700;}
#dr-app .statuschip[aria-pressed="true"]:hover{border-color:transparent;filter:brightness(.95);}
#dr-app .statuschip.overdue[aria-pressed="true"]{background:var(--brand);color:var(--ink);}
#dr-app .statuschip.error[aria-pressed="true"]{background:var(--red);color:#ffffff;}

#dr-app .summarybar{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 16px;font-size:13px;color:var(--body);}
#dr-app .summarybar b{font-size:17px;color:var(--ink);}

#dr-app .groups{display:flex;flex-direction:column;gap:22px;}
#dr-app .month-group h3{font-size:13px;font-weight:700;color:var(--body);margin:0 0 10px;padding-left:2px;}
#dr-app .cards{display:flex;flex-direction:column;gap:12px;}

#dr-app .card{border-radius:var(--r);border:1.2px solid var(--line);overflow:hidden;background:var(--paper);transition:border-color var(--ease),opacity var(--ease);}

#dr-app .card:not(.open):hover{border-color:var(--card-hover, var(--brand));}

#dr-app .groups.has-open .card:not(.open){opacity:.35;filter:grayscale(1);}
#dr-app .card-top{padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;flex-wrap:wrap;}
#dr-app .card-top .idcode{font-weight:900;font-size:13.5px;flex:0 0 auto;font-family:monospace,inherit;}
#dr-app .card-top .cname{font-weight:700;font-size:14px;flex:1 1 200px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#dr-app .card-top .cmeta{font-size:12px;color:var(--body);flex:0 0 auto;}
#dr-app .status-pill{font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:999px;flex:0 0 auto;white-space:nowrap;}
#dr-app .card-top .caret{flex:0 0 auto;width:11px;height:7px;transition:transform var(--ease);}
#dr-app .card.open .caret{transform:rotate(180deg);}

#dr-app .card.bg-error .card-top{background:var(--red-l);}
#dr-app .card.bg-overdue .card-top{background:var(--brand-l);}
#dr-app .card.bg-normal .card-top{background:var(--paper);}
#dr-app .card.is-grey:not(.open){filter:grayscale(1);}

#dr-app .card.is-deleted{filter:grayscale(1);}
#dr-app .card.is-deleted .card-top{cursor:default;}
#dr-app .card.is-deleted .caret{visibility:hidden;}
#dr-app .card.is-deleted:hover{border-color:var(--line);}

#dr-app .card-detail{display:none;background:var(--paper);border-top:1.2px solid var(--hair);padding:18px 16px;}
#dr-app .card.open .card-detail{display:block;}

#dr-app .dpanel{border:1.2px solid var(--hair);border-radius:var(--r);padding:14px;margin-bottom:14px;background:var(--paper);transition:border-color var(--ease);}

#dr-app .dpanel:hover{border-color:var(--card-hover, var(--brand));}
#dr-app .card-detail input:hover,
#dr-app .card-detail textarea:hover,
#dr-app .card-detail select:hover,
#dr-app .card-detail input:focus,
#dr-app .card-detail textarea:focus,
#dr-app .card-detail select:focus{border-color:var(--card-hover, var(--brand));}
#dr-app .dpanel:last-child{margin-bottom:0;}
#dr-app .dpanel-title{font-size:12.5px;font-weight:700;color:var(--body);margin-bottom:10px;}
#dr-app .drow{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media (max-width:640px){#dr-app .drow{grid-template-columns:1fr;}}
#dr-app .dfield{margin-bottom:10px;}
#dr-app .dfield:last-child{margin-bottom:0;}
#dr-app .dfield label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;}
#dr-app .dfield input,#dr-app .dfield textarea,#dr-app .dfield select{width:100%;}

#dr-app textarea{resize:vertical;}
#dr-app .dfield textarea{min-height:56px;max-height:168px;}

#dr-app .statuschips-inline{display:flex;gap:7px;flex-wrap:wrap;}

#dr-app .schip{height:28px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-family:inherit;font-size:12px;color:var(--ink);cursor:pointer;transition:background-color var(--ease),border-color var(--ease),color var(--ease);}
#dr-app .schip:hover{border-color:var(--schip-color, var(--brand));}
#dr-app .schip[aria-pressed="true"]{border-color:transparent;font-weight:700;}
#dr-app .schip[aria-pressed="true"]:hover{border-color:transparent;filter:brightness(.95);}

#dr-app .chip{height:30px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-family:inherit;font-size:12.5px;color:var(--ink);cursor:pointer;transition:background-color var(--ease),border-color var(--ease),color var(--ease);}
#dr-app .chip:hover{border-color:var(--brand);}

#dr-app .chip.c-digital:hover{border-color:var(--blue);}
#dr-app .chip.c-print:hover{border-color:var(--brown);}
#dr-app .chip[aria-pressed="true"]{background:var(--brand);border-color:transparent;font-weight:700;color:var(--ink);}
#dr-app .chip[aria-pressed="true"]:hover{border-color:transparent;filter:brightness(.95);}

#dr-app .chip.c-digital[aria-pressed="true"]{background:var(--blue);}
#dr-app .chip.c-print[aria-pressed="true"]{background:var(--brown);color:#ffffff;}

#dr-app .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;border:1px solid transparent;color:var(--ink);flex:0 0 auto;}
#dr-app .badge.pending{background:var(--body);color:#ffffff;}
#dr-app .badge.ready{background:var(--body);color:#ffffff;}
#dr-app .badge.digital{background:var(--blue);}
#dr-app .badge.print{background:var(--brown);color:#ffffff;}
#dr-app .badge.lv2{background:transparent;border-color:currentColor;}
#dr-app .badge.lv2.pending{color:var(--body);}
#dr-app .badge.lv2.ready{color:var(--body);}
#dr-app .badge.lv2.digital{color:var(--blue);}
#dr-app .badge.lv2.print{color:var(--brown);}

#dr-app .itemblock{border:1.2px solid var(--hair);border-radius:var(--r);padding:12px;margin-bottom:10px;background:var(--tint);transition:border-color var(--ease);}
#dr-app .itemblock:hover{border-color:var(--card-hover, var(--brand));}
#dr-app .itemblock:last-child{margin-bottom:0;}

#dr-app .itemblock-title{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
#dr-app .itemblock-title .idx{
  flex:0 0 auto;width:22px;height:22px;border-radius:50%;
  border:1.5px solid var(--ink);background:transparent;color:var(--ink);
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;
}
#dr-app .itemblock-title .badges{display:flex;gap:6px;flex-wrap:wrap;}
#dr-app .itemblock-head{display:flex;gap:10px;margin-bottom:10px;}
#dr-app .itemblock-head .dfield{flex:1 1 auto;margin:0;}
#dr-app .notice-box{padding:12px;background:var(--tint);border:1.2px dashed var(--hair);border-radius:var(--r);font-size:12.5px;color:var(--body);}
#dr-app .copy4{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media (max-width:640px){#dr-app .copy4{grid-template-columns:1fr;}}
#dr-app .sizerow{display:grid;grid-template-columns:1.2fr 1fr;gap:8px;margin-bottom:8px;}
#dr-app .readonly{background:var(--tint);color:var(--body);border-color:var(--hair);}

#dr-app .add-line{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--line);background:transparent;color:var(--ink);font-family:inherit;font-size:12.5px;font-weight:700;border-radius:999px;height:30px;padding:0 13px;cursor:pointer;transition:border-color var(--ease);}
#dr-app .add-line:hover{border-color:var(--brand);}
#dr-app .del-line{border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px;flex:0 0 auto;}
#dr-app .del-line:hover{color:var(--red);}

#dr-app .logbox{font-size:11.5px;color:var(--muted);border-top:1px solid var(--hair);padding:10px 14px 0;margin:6px -14px 0;max-height:130px;overflow-y:auto;}
#dr-app .logbox .entry{padding:2px 0;}

#dr-app .detail-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
#dr-app .btn-sm{height:36px;padding:0 16px;border-radius:999px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;border:1px solid var(--ink);background:transparent;color:var(--ink);transition:background-color var(--ease),border-color var(--ease),color var(--ease);}
#dr-app .btn-sm:hover{background:var(--ink);border-color:var(--ink);color:#ffffff;}
#dr-app .btn-sm.danger{border-color:var(--red);color:var(--ink);}
#dr-app .btn-sm.danger:hover{background:var(--red);border-color:var(--red);color:var(--ink);}
#dr-app .btn-sm.primary{background:var(--brand);border-color:var(--brand);color:var(--ink);}
#dr-app .btn-sm.primary:hover{background:var(--brand);border-color:var(--brand);color:var(--ink);filter:brightness(.95);}
#dr-app .saved-hint{font-size:12px;color:var(--body);opacity:0;transition:opacity var(--ease);align-self:center;}
#dr-app .saved-hint.show{opacity:1;}

#dr-app .empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:13px;}

#dr-app .pager{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:26px;}
#dr-app .pgbtn{height:34px;padding:0 18px;border-radius:999px;border:1px solid var(--ink);background:transparent;color:var(--ink);font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;transition:background-color var(--ease),border-color var(--ease),color var(--ease);}
#dr-app .pgbtn:hover{background:var(--ink);border-color:var(--ink);color:#ffffff;}
#dr-app .pgbtn[disabled]{opacity:.3;cursor:not-allowed;}
#dr-app .pgbtn[disabled]:hover{background:transparent;border-color:var(--ink);color:var(--ink);}
#dr-app .pginfo{font-size:12.5px;color:var(--body);min-width:72px;text-align:center;}

[hidden]{display:none!important;}

.btn-sm.is-loading{pointer-events:none;opacity:.72}
.btn-sm .action-spinner{display:none;width:14px;height:14px;border-radius:50%;border:2px solid rgba(17,17,17,.22);border-top-color:currentColor;animation:action-spin .7s linear infinite}
.btn-sm.is-loading .action-spinner{display:inline-block}
.btn-sm.is-loading .action-label{display:none}
@keyframes action-spin{to{transform:rotate(360deg)}}

</style>

<body>
<div id="dr-app">

  <div class="devbadge" id="dr-systemmsg">正在驗證公司帳號並載入案件…</div>

  <div class="topbar">
    <div class="topbar-in">
      <div class="topbar-title">允禾發 設計需求表<span class="topbar-kind">總覽</span></div>
      <div class="topbar-sub" id="dr-datetime"></div>
      <div class="topbar-user">
        <div id="dr-login-slot"></div>
        <div class="avatar" id="dr-avatar">朱</div>
        <span id="dr-username">朱昱丞</span>
        <button class="btn-link" id="dr-logout">登出</button>
      </div>
      <a class="btn-topbar" href="index.html" target="_blank" rel="noopener">＋ 新增申請</a>
    </div>
  </div>

  <div class="wrap">

    <div class="filterbar">
      <div class="filterrow">
        <input type="text" id="f-search" placeholder="搜尋需求名稱、申請人、編號…">
        <select id="f-dept"><option value="">全部部門</option></select>
        <select id="f-status"><option value="">全部狀態</option></select>
      </div>
      <div class="chiprow" id="dr-quickchips"></div>
    </div>

    <div class="summarybar" id="dr-summary"></div>

    <div class="groups" id="dr-groups"></div>
    <div class="empty" id="dr-empty" hidden>目前沒有符合條件的申請單。</div>

    <div class="pager" id="dr-pager" hidden>
      <button type="button" class="pgbtn" id="dr-prev">上一頁</button>
      <span class="pginfo" id="dr-pginfo"></span>
      <button type="button" class="pgbtn" id="dr-next">下一頁</button>
    </div>

  </div>
</div>

<script>
(function(){
"use strict";

var API_URL = "https://script.google.com/a/macros/harfunco.com/s/AKfycbyZgxQNyQuQCX_Vmp5tlrgQ6p_-pEugmehm9StOCbp3IC32WeDjYoST1iqiCuM7VZDN/exec";
var GOOGLE_CLIENT_ID = "610204517549-khmef2c4ejmeg0jrceg53385ptu2ns03.apps.googleusercontent.com";
var GOOGLE_CREDENTIAL = "";
var CURRENT_USER = { name:"", email:"", initials:"" };
var REMOTE_RECORDS = [];

document.getElementById("dr-datetime").textContent = (function(){
  var d = new Date();
  return d.getFullYear()+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+String(d.getDate()).padStart(2,"0");
})();

function initialsOf(name){
  var parts = String(name||"").trim().split(/\s+/).filter(Boolean);
  if(parts.length>=2) return (parts[0].charAt(0)+parts[parts.length-1].charAt(0)).toUpperCase();
  return String(name||"").replace(/\s+/g,"").slice(0,2).toUpperCase();
}

function setCurrentUser(user){
  CURRENT_USER = {
    name: user.name || user.email || "",
    email: user.email || "",
    initials: initialsOf(user.name || user.email || "")
  };
  document.getElementById("dr-username").textContent = CURRENT_USER.name;
  document.getElementById("dr-avatar").textContent = CURRENT_USER.name.charAt(0) || "・";
}

function apiPost(action, data){
  return fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(Object.assign({
      action:action,
      credential:GOOGLE_CREDENTIAL
    }, data||{}))
  }).then(function(res){
    return res.json();
  }).then(function(json){
    if(!json.ok) throw new Error(json.error || "API 發生錯誤");
    return json;
  });
}

function loadRecords(){
  return REMOTE_RECORDS;
}

function saveRecords(){
  throw new Error("目前總覽為唯讀模式，尚未開放修改。");
}

function showSystemMessage(text, isError){
  var el = document.getElementById("dr-systemmsg");
  el.textContent = text;
  el.style.color = isError ? "#b42318" : "";
}

function loadRemoteRequests(){
  showSystemMessage("正在載入案件…", false);
  return apiPost("listRequests").then(function(json){
    REMOTE_RECORDS = Array.isArray(json.requests) ? json.requests : [];
    showSystemMessage("已連線至設計需求系統", false);
    currentPage = 1;
    openCardId = null;
    renderAll();
  });
}

function handleCredentialResponse(response){
  GOOGLE_CREDENTIAL = response && response.credential ? response.credential : "";
  if(!GOOGLE_CREDENTIAL){
    showSystemMessage("Google 未回傳登入憑證，請重新登入。", true);
    return;
  }

  showSystemMessage("正在驗證公司帳號…", false);
  apiPost("whoAmI").then(function(json){
    setCurrentUser(json.user || {});
    showSystemMessage("登入成功，正在載入案件…", false);
    return loadRemoteRequests().catch(function(err){
      showSystemMessage("登入成功，但案件載入失敗："+err.message, true);
      throw err;
    });
  }).catch(function(err){
    if(String(err.message||"").indexOf("案件載入失敗")>=0) return;
    GOOGLE_CREDENTIAL = "";
    showSystemMessage("登入驗證失敗："+err.message, true);
  });
}

function startGoogleLogin(){
  if(!window.google || !google.accounts || !google.accounts.id){
    setTimeout(startGoogleLogin, 150);
    return;
  }

  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleCredentialResponse,
    hd: "harfunco.com",
    auto_select: true
  });

  google.accounts.id.renderButton(
    document.getElementById("dr-login-slot"),
    {theme:"outline", size:"medium", text:"signin_with"}
  );

  google.accounts.id.prompt();
}

var DEPTS = ["BAUI","BAUII"];

var URGENT_WORKING_DAYS = 5;

var PAGE_SIZE = 20;
var currentPage = 1;

var STATUS_META = {
  "待確認": {bg:"#666666", fg:"#ffffff", dot:"#666666"},
  "已排程": {bg:"#4AACFE", fg:"#111111", dot:"#4AACFE"},
  "設計中": {bg:"#f8b500", fg:"#111111", dot:"#f8b500"},
  "完稿":   {bg:"#f8b500", fg:"#111111", dot:"#f8b500"},
  "結案":   {bg:"#8CCDB8", fg:"#111111", dot:"#8CCDB8"},
  "退回":   {bg:"#ef8585", fg:"#111111", dot:"#ef8585"},
  "取消":   {bg:"#ef8585", fg:"#111111", dot:"#ef8585"}
};
var STATUSES = Object.keys(STATUS_META);

var PRINT_SIZE_DEFS = [

function typeOf(id){ for (var i=0;i<TYPES.length;i++){ if(TYPES[i].id===id) return TYPES[i]; } return null; }
function applyDefaultSize(it){
  var t = typeOf(it.typeId);
  if(!t || !t.sizes || t.sizes.length!==1) return;
  var d = t.sizes[0];
  if(d.custom) return;
  it.sizeRows[0].purpose = d.label;
  if(d.w && d.h) it.sizeRows[0].px = d.w+"×"+d.h+(d.unit||"px");
  else if(d.note) it.sizeRows[0].px = d.note;
}

function parseDate(s){ if(!s) return null; var p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function workingDaysBetween(from, to){
  if(!from || !to) return null;
  var count=0; var d=new Date(from.getFullYear(),from.getMonth(),from.getDate());
  var end=new Date(to.getFullYear(),to.getMonth(),to.getDate());
  if(end<=d) return 0;
  while(d<end){ d.setDate(d.getDate()+1); var wd=d.getDay(); if(wd!==0 && wd!==6) count++; }
  return count;
}
function isOverdue(rec){
  var d = parseDate(rec.data.deliveryDate);
  if(!d) return false;
  var today = new Date(); today.setHours(0,0,0,0);
  return d < today;
}
function isUrgent(rec){
  var d = parseDate(rec.data.deliveryDate);
  if(!d) return false;
  var today = new Date(); today.setHours(0,0,0,0);
  var wd = workingDaysBetween(today, d);
  return wd!==null && wd<URGENT_WORKING_DAYS && d>=today;
}
function itemHasCopy(it){
  var t = typeOf(it.typeId);
  if(t && t.mode==="structure"){
    return (it.blocks||[]).some(function(b){ return (b.head||"").trim()||(b.sub||"").trim()||(b.small||"").trim()||(b.other||"").trim(); });
  }
  var c = it.copy||{};
  return (c.head||"").trim()||(c.sub||"").trim()||(c.small||"").trim()||(c.other||"").trim();
}
function isPending(rec){
  return (rec.data.items||[]).some(function(it){
    var t = typeOf(it.typeId);
    return t && t.mode!=="notice" && !itemHasCopy(it);
  });
}
function hasError(rec){
  if(!rec.data.items || rec.data.items.length===0) return true;
  return rec.data.items.some(function(it){ return !it.typeId; });
}

function matchesFilter(rec){
  var q = document.getElementById("f-search").value.trim().toLowerCase();
  if(q){
    var hay = (rec.id+" "+rec.data.name+" "+(rec.submitter?rec.submitter.name+rec.submitter.email:"")).toLowerCase();
    if(hay.indexOf(q)===-1) return false;
  }
  var dept = document.getElementById("f-dept").value;
  if(dept && rec.data.dept!==dept) return false;
  var status = document.getElementById("f-status").value;
  if(status && rec.status!==status) return false;
  
  if(activeQuick.overdue || activeQuick.error){
    
    if(rec.deleted) return false;
    var hit = (activeQuick.overdue && isOverdue(rec)) || (activeQuick.error && hasError(rec));
    if(!hit) return false;
  }
  return true;
}

function cardBgClass(rec){
  var cls;
  if(hasError(rec) || rec.status==="退回" || rec.status==="取消") cls = "bg-error";
  else if(isOverdue(rec)) cls = "bg-overdue";
  else cls = "bg-normal";
  if((isOverdue(rec) && rec.status==="結案") || rec.status==="取消") cls += " is-grey";
  return cls;
}

    }catch(err){
      setActionLoading(btnDelete, false);
      flash("刪除失敗："+err.message);
    }
  });

  actions.appendChild(btnSave);
  actions.appendChild(btnResend);
  actions.appendChild(btnWord);
  actions.appendChild(hintEl);
  actions.appendChild(btnDelete);
  frag.appendChild(actions);

  container.innerHTML = "";
  container.appendChild(frag);
}

function newItemData(){
  return { _id:"it"+Date.now()+Math.random().toString(16).slice(2), name:"", typeId:"", output:[], sizeRows:[{purpose:"",customText:"",px:""}], printQty:"", exposure:"", exposureModel:"", copy:{head:"",sub:"",small:"",other:""}, channel:"", useDate:"", cta:"", note:"", page:"", platform:[], pagecount:"", blocks:[] };
}

function buildItemBadgesHTML(it){
  var t = typeOf(it.typeId);
  var html = "";
  if(!t) return html;
  if(t.forcePrint){
    html += '<span class="badge lv2 print">印刷</span>';
  } else if(t.mode!=="notice" && t.mode!=="structure"){
    if((it.output||[]).indexOf("digital")>=0) html += '<span class="badge lv2 digital">數位</span>';
    if((it.output||[]).indexOf("print")>=0) html += '<span class="badge lv2 print">印刷</span>';
  }
  if(t.mode!=="notice"){
    html += itemHasCopy(it) ? '<span class="badge lv2 ready">文案已提供</span>' : '<span class="badge lv2 pending">文案待補</span>';
  }
  return html;
}

function buildItemBlock(it, idx, onStructuralChange, onDelete){
  var box = document.createElement("div"); box.className="itemblock";

  
  var titleRow = document.createElement("div"); titleRow.className="itemblock-title";
  var idxEl = document.createElement("div"); idxEl.className="idx"; idxEl.textContent = String(idx+1);
  titleRow.appendChild(idxEl);
  var badgesEl = document.createElement("div"); badgesEl.className="badges";
  badgesEl.innerHTML = buildItemBadgesHTML(it);
  titleRow.appendChild(badgesEl);
  box.appendChild(titleRow);

  var head = document.createElement("div"); head.className="itemblock-head";
  head.appendChild(dfieldText("項目名稱", it.name, function(v){ it.name=v; }));
  var typeField = document.createElement("div"); typeField.className="dfield";
  typeField.innerHTML = "<label>需求類型</label>";
  var sel = document.createElement("select");
  var opt0 = document.createElement("option"); opt0.value=""; opt0.textContent="請選擇"; sel.appendChild(opt0);
  TYPES.forEach(function(t){ var o=document.createElement("option"); o.value=t.id; o.textContent=t.label; if(it.typeId===t.id) o.selected=true; sel.appendChild(o); });
  sel.addEventListener("click", function(e){ e.stopPropagation(); });
  sel.addEventListener("change", function(e){
    e.stopPropagation();
    it.typeId = sel.value;
    var t = typeOf(it.typeId);
    it.sizeRows = [{purpose:"",customText:"",px:""}];
    if(t && t.forcePrint) it.output=["print"]; else it.output=[];
    applyDefaultSize(it);
    onStructuralChange();
  });
  typeField.appendChild(sel);
  head.appendChild(typeField);
  box.appendChild(head);

  var t = typeOf(it.typeId);
  if(t){
    if(t.mode==="notice"){
      var nb = document.createElement("div"); nb.className="notice-box"; nb.textContent=t.notice;
      box.appendChild(nb);
    } else if(t.mode==="structure"){
      (it.blocks||[]).forEach(function(bk, bi){
        var bwrap = document.createElement("div"); bwrap.style.cssText="border:1px solid var(--hair);border-radius:8px;padding:10px;margin-bottom:8px;background:var(--paper);";
        var c4 = document.createElement("div"); c4.className="copy4";
        c4.appendChild(dfieldText("大標", bk.head, function(v){ bk.head=v; }));
        c4.appendChild(dfieldText("副標", bk.sub, function(v){ bk.sub=v; }));
        c4.appendChild(dfieldText("小字", bk.small, function(v){ bk.small=v; }));
        c4.appendChild(dfieldText("其他", bk.other, function(v){ bk.other=v; }));
        bwrap.appendChild(c4);
        var delB = document.createElement("button"); delB.type="button"; delB.className="del-line"; delB.textContent="刪除區塊";
        delB.addEventListener("click", function(e){
          e.stopPropagation();
          it.blocks = it.blocks.filter(function(x){ return x!==bk; });
          onStructuralChange();
        });
        bwrap.appendChild(delB);
        box.appendChild(bwrap);
      });
      var addBlk = document.createElement("button"); addBlk.type="button"; addBlk.className="add-line"; addBlk.textContent="＋ 新增區塊";
      addBlk.addEventListener("click", function(e){
        e.stopPropagation();
        it.blocks = it.blocks || [];
        it.blocks.push({_id:"bk"+Date.now(), head:"",sub:"",small:"",other:"", imgNote:"", link:""});
        onStructuralChange();
      });
      box.appendChild(addBlk);
    } else {
      if(!t.forcePrint){
        var outField = document.createElement("div"); outField.className="dfield";
        outField.innerHTML = "<label>輸出形式</label>";
        var outRow = document.createElement("div"); outRow.className="statuschips-inline";
        [["digital","數位"],["print","印刷"]].forEach(function(pair){
          var c = document.createElement("button"); c.type="button"; c.className="chip c-"+pair[0]; c.textContent=pair[1];
          c.setAttribute("aria-pressed", it.output.indexOf(pair[0])>=0 ? "true":"false");
          c.addEventListener("click", function(e){
            e.stopPropagation();
            var i = it.output.indexOf(pair[0]);
            if(i>=0) it.output.splice(i,1); else it.output.push(pair[0]);
            onStructuralChange();
          });
          outRow.appendChild(c);
        });
        outField.appendChild(outRow);
        box.appendChild(outField);
      }

      var options = (t.sizes||[]).slice();
      if(!t.forcePrint && it.output.indexOf("print")>=0){ options = options.concat(PRINT_SIZE_DEFS); }
      if(options.length){
        (it.sizeRows||[]).forEach(function(row){
          var r = document.createElement("div"); r.className="sizerow";
          var sf = document.createElement("div"); sf.className="dfield"; sf.style.margin="0";
          if(row.purpose==="__custom__"){
            
            var cw = document.createElement("div");
            cw.style.cssText="display:flex;align-items:center;gap:6px;border:1.2px solid var(--line);border-radius:var(--r);padding:0 4px 0 12px;height:38px;background:var(--paper);";
            var pfx = document.createElement("span"); pfx.textContent="自訂：";
            pfx.style.cssText="font-size:12.5px;color:var(--body);flex:0 0 auto;white-space:nowrap;";
            cw.appendChild(pfx);
            var ci = document.createElement("input"); ci.type="text"; ci.placeholder="輸入用途名稱"; ci.value=row.customText||"";
            ci.style.cssText="border:0;padding:6px 4px;height:100%;flex:1 1 auto;background:transparent;";
            ci.addEventListener("click", function(e){ e.stopPropagation(); });
            ci.addEventListener("input", function(){ row.customText=ci.value; });
            cw.appendChild(ci);
            var back = document.createElement("button"); back.type="button"; back.textContent="✕";
            back.style.cssText="border:0;background:none;cursor:pointer;color:var(--muted);flex:0 0 auto;font-size:13px;";
            back.addEventListener("click", function(e){
              e.stopPropagation();
              row.purpose=""; row.customText=""; row.px="";
              onStructuralChange();
            });
            cw.appendChild(back);
            sf.appendChild(cw);
            r.appendChild(sf);
          } else {
          var s = document.createElement("select");
          var o0 = document.createElement("option"); o0.value=""; o0.textContent="用途／版位"; s.appendChild(o0);
          options.forEach(function(opt){
            var o = document.createElement("option"); o.value=opt.custom?"__custom__":opt.label; o.textContent=opt.label;
            if(row.purpose===o.value) o.selected=true;
            s.appendChild(o);
          });
          s.addEventListener("click", function(e){ e.stopPropagation(); });
          s.addEventListener("change", function(e){
            e.stopPropagation();
            row.purpose = s.value;
            var def=null;
            for(var i=0;i<options.length;i++){ if(options[i].label===row.purpose){ def=options[i]; break; } }
            if(def && def.w && def.h) row.px = def.w+"×"+def.h+(def.unit||"px");
            else if(def && def.note) row.px = def.note;
            else if(row.purpose!=="__custom__") row.px="";
            onStructuralChange();
          });
          sf.appendChild(s);
          r.appendChild(sf);
          }

          var pf = document.createElement("div"); pf.className="dfield"; pf.style.margin="0";
          var pxi = document.createElement("input"); pxi.type="text"; pxi.placeholder="實際尺寸"; pxi.value=row.px||"";
          var frozen = false;
          if(row.purpose && row.purpose!=="__custom__"){
            var d=null; for(var j=0;j<options.length;j++){ if(options[j].label===row.purpose){ d=options[j]; break; } }
            if(d && (d.w||d.note)) frozen=true;
          }
          if(frozen){ pxi.disabled=true; pxi.classList.add("readonly"); }
          else { pxi.addEventListener("click", function(e){e.stopPropagation();}); pxi.addEventListener("input", function(){ row.px=pxi.value; }); }
          pf.appendChild(pxi);
          r.appendChild(pf);
          box.appendChild(r);
        });
      }
      if(it.output.indexOf("print")>=0){
        box.appendChild(dfieldNumber("數量", it.printQty, function(v){ it.printQty=v; }));
      }

      var expField = document.createElement("div"); expField.className="dfield";
      expField.innerHTML = "<label>商品曝光</label>";
      var expRow = document.createElement("div"); expRow.className="statuschips-inline";
      [["reveal","露出商品"],["free","不限"]].forEach(function(pair){
        var c = document.createElement("button"); c.type="button"; c.className="chip"; c.textContent=pair[1];
        c.setAttribute("aria-pressed", it.exposure===pair[0] ? "true":"false");
        c.addEventListener("click", function(e){
          e.stopPropagation();
          it.exposure = (it.exposure===pair[0]) ? "" : pair[0];
          if(it.exposure!=="reveal") it.exposureModel="";
          onStructuralChange();
        });
        expRow.appendChild(c);
      });
      expField.appendChild(expRow);
      box.appendChild(expField);
      if(it.exposure==="reveal"){
        box.appendChild(dfieldText("商品型號", it.exposureModel, function(v){ it.exposureModel=v; }));
      }

      var c4b = document.createElement("div"); c4b.className="copy4";
      c4b.appendChild(dfieldText("大標", it.copy.head, function(v){ it.copy.head=v; }));
      c4b.appendChild(dfieldText("副標", it.copy.sub, function(v){ it.copy.sub=v; }));
      c4b.appendChild(dfieldText("小字", it.copy.small, function(v){ it.copy.small=v; }));
      c4b.appendChild(dfieldText("其他", it.copy.other, function(v){ it.copy.other=v; }));
      box.appendChild(c4b);

      if(t.showChannel){ box.appendChild(dfieldText("使用位置", it.channel, function(v){ it.channel=v; })); }
      box.appendChild(dfieldDate("交付日", it.useDate, function(v){ it.useDate=v; }));
    }
    
    if(t.mode!=="notice"){
      box.appendChild(dfieldTextarea("項目備註", it.note, function(v){ it.note=v; }));
    }
  }

  var delItemB = document.createElement("button"); delItemB.type="button"; delItemB.className="del-line"; delItemB.textContent="刪除此項目";
  delItemB.style.marginTop="8px";
  delItemB.addEventListener("click", function(e){ e.stopPropagation(); onDelete(); });
  box.appendChild(delItemB);

  return box;
}

function dfieldText(label, val, onChange){
  var f = document.createElement("div"); f.className="dfield";
  f.appendChild(elh("label", label));
  var i = document.createElement("input"); i.type="text"; i.value=val||"";
  i.addEventListener("click", function(e){e.stopPropagation();});
  i.addEventListener("input", function(){ onChange(i.value); });
  f.appendChild(i);
  return f;
}
function dfieldTextarea(label, val, onChange){
  var f = document.createElement("div"); f.className="dfield";
  f.appendChild(elh("label", label));
  var i = document.createElement("textarea"); i.value=val||"";
  i.addEventListener("click", function(e){e.stopPropagation();});
  i.addEventListener("input", function(){ onChange(i.value); });
  f.appendChild(i);
  return f;
}
function dfieldDate(label, val, onChange){
  var f = document.createElement("div"); f.className="dfield";
  f.appendChild(elh("label", label));
  var i = document.createElement("input"); i.type="date"; i.value=val||"";
  i.addEventListener("click", function(e){e.stopPropagation();});
  i.addEventListener("input", function(){ onChange(i.value); });
  f.appendChild(i);
  return f;
}
function dfieldNumber(label, val, onChange){
  var f = document.createElement("div"); f.className="dfield";
  f.appendChild(elh("label", label));
  var i = document.createElement("input"); i.type="number"; i.min="0"; i.value=val||"";
  i.addEventListener("click", function(e){e.stopPropagation();});
  i.addEventListener("input", function(){ onChange(i.value); });
  f.appendChild(i);
  return f;
}

  currentPage++; openCardId = null; renderAll();

});
