<style>
:root{color-scheme:light;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:#eeeeee;}
#dr-app{
  --brand:#f8b500; --brand-l:#fff3d1; --brand-dk:#d39a00; 
  --ink:#111111; --body:#666666; --muted:#9fa0a0;
  --line:#bababa; --hair:#d8d6d0;
  --paper:#ffffff; --tint:#eeeeee;
  --blue:#4AACFE; --blue-l:#e5f4ff;
  --brown:#AC6A27;
  --green:#8CCDB8; --green-l:#e3f5ee;
  --red:#ef8585; --red-l:#fbe3e3;
  --yellow-l:#fff3d1;
  --grey-inv:#d8d8d8;
  --r:8px; --shadow:4px 4px 6px rgba(0,0,0,.15);
  --ease:.18s;
  font-family:'Noto Sans TC','Noto Sans',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  color:var(--ink); background:var(--tint);
  min-height:100vh; line-height:1.7; letter-spacing:.02em;
  -webkit-font-smoothing:antialiased;
--control-accent:var(--brand);}
#dr-app *{box-sizing:border-box;}
#dr-app .wrap{max-width:1040px;margin:0 auto;padding:0 20px 80px;}

#dr-app .topbar{
  background:rgba(255,255,255,.45); -webkit-backdrop-filter:blur(15px); backdrop-filter:blur(15px);
  border-bottom:1.2px solid var(--hair);
  position:sticky;top:0;z-index:50;
}
#dr-app .topbar-in{max-width:1040px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:12px;}
#dr-app .topbar-title{font-weight:700;font-size:16px;letter-spacing:.04em;flex:0 0 auto;}
#dr-app .topbar-kind{font-weight:500;font-size:12px;color:var(--body);margin-left:8px;letter-spacing:.06em;}
#dr-app .btn-link{border:0;background:none;color:var(--body);font-size:12px;cursor:pointer;text-decoration:underline;font-family:inherit;padding:0;}
#dr-app .topbar-sub{font-size:12px;color:var(--muted);flex:1 1 auto;}
#dr-app .topbar-user{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--body);flex:0 0 auto;}
#dr-app .avatar{width:26px;height:26px;border-radius:50%;background:var(--brand);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:0 0 auto;}

#dr-app .btn-topbar{flex:0 0 auto;height:34px;padding:0 18px;border-radius:999px;border:1px solid var(--brand);background:var(--brand);color:var(--ink);font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.04em;cursor:pointer;display:inline-flex;align-items:center;text-decoration:none;transition:filter var(--ease),transform var(--ease);}
@media(hover:hover) and (pointer:fine){
  #dr-app .btn-topbar:hover{filter:brightness(.95);transform:scale(1.02);}
}
#dr-app .devbadge{background:#eeeeee;border-bottom:1.2px solid var(--hair);text-align:center;font-size:12px;color:var(--body);padding:6px 12px;}

#dr-app .filterbar{background:var(--paper);border:1.2px solid var(--line);border-radius:var(--r);padding:16px;margin:16px 0;}
#dr-app .filterrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
#dr-app .filterrow input[type=text]{flex:1 1 220px;min-width:160px;}
#dr-app .filterrow select{flex:0 0 auto;width:auto;min-width:120px;}
#dr-app input[type=text],#dr-app select,#dr-app textarea,#dr-app input[type=date],#dr-app input[type=number]{
  --control-accent:inherit;
  font-family:inherit;font-size:14px;color:var(--ink);background:var(--paper);
  border:1.2px solid var(--line);border-radius:var(--r);padding:9px 12px;outline:none;transition:border-color var(--ease);
  -webkit-tap-highlight-color:transparent;
}
@media(hover:hover) and (pointer:fine){
  #dr-app input:hover,#dr-app select:hover,#dr-app textarea:hover{border-color:var(--control-accent);}
}
#dr-app input:focus,#dr-app select:focus,#dr-app textarea:focus{border-color:var(--control-accent);}
#dr-app select{appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='11' height='7'><path d='M1 1l4.5 4.5L10 1' stroke='%23111' stroke-width='1.6' fill='none'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;padding-right:30px;}
#dr-app .chiprow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}

#dr-app .statuschip{height:30px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-family:inherit;font-size:12px;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;transition:background-color var(--ease),border-color var(--ease),color var(--ease);}
@media(hover:hover) and (pointer:fine){
  #dr-app .statuschip.overdue:hover{border-color:var(--brand);}
}
@media(hover:hover) and (pointer:fine){
  #dr-app .statuschip.error:hover{border-color:var(--red);}
}
#dr-app .statuschip[aria-pressed="true"]{border-color:transparent;font-weight:700;}
@media(hover:hover) and (pointer:fine){
  #dr-app .statuschip[aria-pressed="true"]:hover{border-color:transparent;filter:brightness(.95);}
}
#dr-app .statuschip.overdue[aria-pressed="true"]{background:var(--brand);color:var(--ink);}
#dr-app .statuschip.error[aria-pressed="true"]{background:var(--red);color:#ffffff;}

#dr-app .summarybar{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 16px;font-size:12px;color:var(--body);}
#dr-app .summarybar b{font-size:16px;color:var(--ink);}

#dr-app .groups{display:flex;flex-direction:column;gap:22px;}
#dr-app .month-group h3{font-size:12px;font-weight:700;color:var(--body);margin:0 0 10px;padding-left:2px;}
#dr-app .cards{display:flex;flex-direction:column;gap:12px;}

#dr-app .card{border-radius:var(--r);border:1.2px solid var(--line);overflow:hidden;background:var(--paper);transition:border-color var(--ease),opacity var(--ease);}

@media(hover:hover) and (pointer:fine){
  #dr-app .card:not(.open):hover{border-color:var(--card-hover, var(--brand));}
}

#dr-app .groups.has-open .card:not(.open){opacity:.35;filter:grayscale(1);}
#dr-app .card-top{padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;flex-wrap:wrap;}
#dr-app .card-top .idcode{font-weight:700;font-size:14px;flex:0 0 auto;font-family:monospace,inherit;}
#dr-app .card-top .cname{font-weight:700;font-size:14px;flex:1 1 200px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#dr-app .card-top .cmeta{font-size:12px;color:var(--body);flex:0 0 auto;}
#dr-app .status-pill{font-size:12px;font-weight:700;padding:4px 11px;border-radius:999px;flex:0 0 auto;white-space:nowrap;}
#dr-app .card-top .caret{flex:0 0 auto;width:11px;height:7px;transition:transform var(--ease);}
#dr-app .card.open .caret{transform:rotate(180deg);}

#dr-app .card.bg-error .card-top{background:var(--red-l);}
#dr-app .card.bg-overdue .card-top{background:var(--brand-l);}
#dr-app .card.bg-normal .card-top{background:var(--paper);}
#dr-app .card.is-grey:not(.open){filter:grayscale(1);}

#dr-app .card-detail{--control-accent:var(--card-hover);display:none;background:var(--paper);border-top:1.2px solid var(--hair);padding:18px 16px;}
#dr-app .card.open .card-detail{display:block;}

#dr-app .dpanel{border:1.2px solid var(--hair);border-radius:var(--r);padding:14px;margin-bottom:14px;background:var(--paper);transition:border-color var(--ease);}

@media(hover:hover) and (pointer:fine){
  #dr-app .dpanel:hover{border-color:var(--card-hover, var(--brand));}
  #dr-app .card-detail input:hover,
  #dr-app .card-detail textarea:hover,
  #dr-app .card-detail select:hover{border-color:var(--card-hover, var(--control-accent));}
}
#dr-app .card-detail input:focus,
#dr-app .card-detail textarea:focus,
#dr-app .card-detail select:focus{border-color:var(--card-hover, var(--control-accent));}
#dr-app .dpanel:last-child{margin-bottom:0;}
#dr-app .dpanel-title{font-size:12px;font-weight:700;color:var(--body);margin-bottom:10px;}
#dr-app .drow{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media (max-width:640px){#dr-app .drow{grid-template-columns:1fr;}}
#dr-app .dfield{margin-bottom:10px;}
#dr-app .dfield:last-child{margin-bottom:0;}
#dr-app .dfield label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;}
#dr-app .dfield input,#dr-app .dfield textarea,#dr-app .dfield select{width:100%;}

#dr-app textarea{resize:vertical;}
#dr-app .dfield textarea{min-height:56px;max-height:168px;}

#dr-app .statuschips-inline{display:flex;gap:7px;flex-wrap:wrap;}

#dr-app .schip{height:28px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-family:inherit;font-size:12px;color:var(--ink);cursor:pointer;transition:background-color var(--ease),border-color var(--ease),color var(--ease);}
@media(hover:hover) and (pointer:fine){
  #dr-app .schip:hover{border-color:var(--schip-color, var(--brand));}
}
#dr-app .schip[aria-pressed="true"]{border-color:transparent;font-weight:700;}
@media(hover:hover) and (pointer:fine){
  #dr-app .schip[aria-pressed="true"]:hover{border-color:transparent;filter:brightness(.95);}
}

#dr-app .chip{height:30px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-family:inherit;font-size:12px;color:var(--ink);cursor:pointer;transition:background-color var(--ease),border-color var(--ease),color var(--ease);}
@media(hover:hover) and (pointer:fine){
  #dr-app .chip:hover{border-color:var(--brand);}
}

@media(hover:hover) and (pointer:fine){
  #dr-app .chip.c-digital:hover{border-color:var(--blue);}
}
@media(hover:hover) and (pointer:fine){
  #dr-app .chip.c-print:hover{border-color:var(--brown);}
}
#dr-app .chip[aria-pressed="true"]{background:var(--brand);border-color:transparent;font-weight:700;color:var(--ink);}
@media(hover:hover) and (pointer:fine){
  #dr-app .chip[aria-pressed="true"]:hover{border-color:transparent;filter:brightness(.95);}
}

#dr-app .chip.c-digital[aria-pressed="true"]{background:var(--blue);}
#dr-app .chip.c-print[aria-pressed="true"]{background:var(--brown);color:#ffffff;}

#dr-app .badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;border:1px solid transparent;color:var(--ink);flex:0 0 auto;}
#dr-app .badge.pending{background:var(--body);color:#ffffff;}
#dr-app .badge.ready{background:var(--body);color:#ffffff;}
#dr-app .badge.digital{background:var(--blue);}
#dr-app .badge.print{background:var(--brown);color:#ffffff;}
#dr-app .badge.lv2{background:transparent;border-color:currentColor;}
#dr-app .badge.lv2.pending{color:var(--body);}
#dr-app .badge.lv2.ready{color:var(--body);}
#dr-app .badge.lv2.digital{color:var(--blue);}
#dr-app .badge.lv2.print{color:var(--brown);}

#dr-app .itemblock{border:1.2px solid var(--hair);border-radius:var(--r);padding:12px;margin-bottom:10px;background:var(--tint);transition:border-color var(--ease);}
@media(hover:hover) and (pointer:fine){
  #dr-app .itemblock:hover{border-color:var(--card-hover, var(--brand));}
}
#dr-app .itemblock:last-child{margin-bottom:0;}

#dr-app .itemblock-title{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
#dr-app .itemblock-title .idx{
  flex:0 0 auto;width:22px;height:22px;border-radius:50%;
  border:1.5px solid var(--ink);background:transparent;color:var(--ink);
  font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;
}
#dr-app .itemblock-title .badges{display:flex;gap:6px;flex-wrap:wrap;}
#dr-app .itemblock-head{display:flex;gap:10px;margin-bottom:10px;}
#dr-app .itemblock-head .dfield{flex:1 1 auto;margin:0;}
#dr-app .notice-box{padding:12px;background:var(--tint);border:1.2px dashed var(--body);border-radius:var(--r);font-size:12px;color:var(--body);}
#dr-app .copy4{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media (max-width:640px){#dr-app .copy4{grid-template-columns:1fr;}}
#dr-app .sizerow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
#dr-app .readonly{background:var(--tint);color:var(--body);border-color:var(--hair);}

#dr-app .add-line{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--line);background:transparent;color:var(--ink);font-family:inherit;font-size:12px;font-weight:700;border-radius:999px;height:30px;padding:0 13px;cursor:pointer;transition:border-color var(--ease);}
@media(hover:hover) and (pointer:fine){
  #dr-app .add-line:hover{border-color:var(--brand);}
}
#dr-app .del-line{border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px;flex:0 0 auto;}
@media(hover:hover) and (pointer:fine){
  #dr-app .del-line:hover{color:var(--red);}
}

#dr-app .logbox{font-size:12px;color:var(--muted);border-top:1px solid var(--hair);padding:10px 14px 0;margin:6px -14px 0;max-height:130px;overflow-y:auto;}
#dr-app .logbox .entry{padding:2px 0;}

#dr-app .detail-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
#dr-app .btn-sm{height:36px;padding:0 16px;border-radius:999px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--ink);background:transparent;color:var(--ink);transition:background-color var(--ease),border-color var(--ease),color var(--ease);}
@media(hover:hover) and (pointer:fine){
  #dr-app .btn-sm:hover{background:var(--ink);border-color:var(--ink);color:#ffffff;}
}
#dr-app .btn-sm.danger{border-color:var(--red);color:var(--ink);}
@media(hover:hover) and (pointer:fine){
  #dr-app .btn-sm.danger:hover{background:var(--red);border-color:var(--red);color:var(--ink);}
}
#dr-app .btn-sm.primary{background:var(--brand);border-color:var(--brand);color:var(--ink);}
@media(hover:hover) and (pointer:fine){
  #dr-app .btn-sm.primary:hover{background:var(--brand);border-color:var(--brand);color:var(--ink);filter:brightness(.95);}
}
#dr-app .saved-hint{font-size:12px;color:var(--body);opacity:0;transition:opacity var(--ease);align-self:center;}
#dr-app .saved-hint.show{opacity:1;}

#dr-app .empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:12px;}

#dr-app .pager{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:26px;}
#dr-app .pgbtn{height:34px;padding:0 18px;border-radius:999px;border:1px solid var(--ink);background:transparent;color:var(--ink);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:background-color var(--ease),border-color var(--ease),color var(--ease);}
@media(hover:hover) and (pointer:fine){
  #dr-app .pgbtn:hover{background:var(--ink);border-color:var(--ink);color:#ffffff;}
}
#dr-app .pgbtn[disabled]{opacity:.3;cursor:not-allowed;}
@media(hover:hover) and (pointer:fine){
  #dr-app .pgbtn[disabled]:hover{background:transparent;border-color:var(--ink);color:var(--ink);}
}
#dr-app .pginfo{font-size:12px;color:var(--body);min-width:72px;text-align:center;}

[hidden]{display:none!important;}

.btn-sm.is-loading{pointer-events:none;opacity:.72}
.btn-sm .action-spinner{display:none;width:14px;height:14px;border-radius:50%;border:2px solid rgba(17,17,17,.22);border-top-color:currentColor;animation:action-spin .7s linear infinite}
.btn-sm.is-loading .action-spinner{display:inline-block}
.btn-sm.is-loading .action-label{display:none}
@keyframes action-spin{to{transform:rotate(360deg)}}

#dr-gate{box-sizing:border-box;width:100%;min-height:100dvh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:32px 20px;text-align:center;background:var(--tint);}
#dr-gate .g-title{font-size:20px;line-height:1.4;font-weight:700;color:var(--ink);}
#dr-gate .g-sub{max-width:380px;margin:0;font-size:12px;line-height:1.7;color:var(--body);}
#dr-gate .g-note{max-width:380px;margin:0;font-size:12px;line-height:1.7;color:var(--muted);}
#dr-gate .google-login-slot{min-height:44px;display:flex;align-items:center;justify-content:center;}
#dr-login-status{min-height:18px;font-size:12px;line-height:1.5;color:var(--body);}
#dr-login-status.err{color:var(--red);}
#dr-app button,#dr-app a,#dr-app input,#dr-app select,#dr-app textarea{touch-action:manipulation;}
#dr-app input,#dr-app select,#dr-app textarea{max-width:100%;min-width:0;}
#dr-app .dfield,#dr-app .drow>*{min-width:0;}
#dr-app .devbadge{overflow:hidden;max-height:40px;opacity:1;transition:max-height .28s ease,opacity .28s ease,padding .28s ease,border-width .28s ease;}
#dr-app .devbadge.is-hiding{max-height:0;opacity:0;padding-top:0;padding-bottom:0;border-width:0;}
#dr-app .mobile-user{display:none;}
@media (hover:none) and (pointer:coarse){
  #dr-app button:active,#dr-app a:active,#dr-app .statuschip:active,#dr-app .schip:active,#dr-app .chip:active,#dr-app .card-top:active,#dr-app .btn-topbar:active{filter:brightness(.94);}
}
@media (max-width:640px){
  #dr-app .wrap{padding-left:12px;padding-right:12px;padding-bottom:110px;}
  #dr-app .topbar-in{padding:12px;gap:8px;}
  #dr-app .topbar-sub,#dr-app .topbar-user{display:none;}
  #dr-app .topbar-title{flex:1 1 auto;}
  #dr-app .btn-topbar{padding:0 14px;}
  #dr-app .filterbar{padding:12px;margin:12px 0;}
  #dr-app .filterrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  #dr-app .filterrow input[type=text]{grid-column:1/-1;width:100%;min-width:0;}
  #dr-app .filterrow select{width:100%;min-width:0;}
  #dr-app .summarybar{gap:12px;margin-bottom:12px;}
  #dr-app .card-top{padding:12px;display:grid;grid-template-columns:auto 1fr auto;gap:6px 8px;align-items:center;}
  #dr-app .card-top .idcode{grid-column:1/2;}
  #dr-app .card-top .cname{grid-column:2/4;min-width:0;}
  #dr-app .card-top .cmeta{grid-column:1/2;justify-self:start;font-size:12px;}
  #dr-app .card-top .cmeta .meta-dept{display:none;}
  #dr-app .card-top .mobile-right{grid-column:2/4;grid-row:2;justify-self:end;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  #dr-app .card-top>.badge,#dr-app .card-top>.status-pill,#dr-app .card-top>.caret{display:none;}
  #dr-app .card-detail{padding:12px;}
  #dr-app .dpanel{padding:12px;}
  #dr-app input[type=date]{width:100%;min-width:0;}
  #dr-app .detail-actions{gap:8px;align-items:stretch;}
  #dr-app .detail-actions .btn-sm{flex:1 1 calc(50% - 8px);justify-content:center;}
  #dr-app .detail-actions .danger{margin-left:0!important;}
  #dr-app .mobile-user{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px 12px 30px;color:var(--body);font-size:12px;}
  #dr-app .mobile-user .identity{display:flex;align-items:center;gap:8px;}
}

#dr-app .topbar-title,#dr-gate .g-title,#dr-app .card-top .idcode{font-weight:700}
#dr-app .month-group h3,#dr-app .card-top .cname,#dr-app .dpanel-title{font-weight:700}

<script>
(function(){

var DETAIL_CACHE = Object.create(null);

var AUTH_HINT_KEY="dr_auth_hint_v1", SESSION_TOKEN_KEY="dr_session_v1", USER_CACHE_KEY="dr_user_v1", SESSION_TOKEN="";

var AUTH_PERSIST_KEY="dr_auth_persist_v1",AUTH_PERSIST_MAX_AGE=65*60*1000;
function saveAuthBridge_(token,userData){
  try{
    if(token)sessionStorage.setItem(SESSION_TOKEN_KEY,token);
    if(userData&&userData.email)sessionStorage.setItem(USER_CACHE_KEY,JSON.stringify(userData));
  }catch(e){}
  try{
    localStorage.setItem(AUTH_PERSIST_KEY,JSON.stringify({
      token:token||"",
      user:userData&&userData.email?userData:null,
      savedAt:Date.now()
    }));
  }catch(e){}

function readAuthBridge_(){
  var token="",cached=null;
  try{
    token=sessionStorage.getItem(SESSION_TOKEN_KEY)||"";
    var rawUser=sessionStorage.getItem(USER_CACHE_KEY);
    if(rawUser)cached=JSON.parse(rawUser);
  }catch(e){}
  if(token&&cached&&cached.email)return{token:token,user:cached};
  try{
    var raw=localStorage.getItem(AUTH_PERSIST_KEY);
    if(!raw)return{token:token,user:cached};
    var p=JSON.parse(raw);
    if(!p||!p.savedAt||Date.now()-Number(p.savedAt)>AUTH_PERSIST_MAX_AGE){
      localStorage.removeItem(AUTH_PERSIST_KEY);
      return{token:token,user:cached};
    }
    if(!token&&p.token)token=String(p.token);
    if((!cached||!cached.email)&&p.user&&p.user.email)cached=p.user;
    if(token)sessionStorage.setItem(SESSION_TOKEN_KEY,token);
    if(cached&&cached.email)sessionStorage.setItem(USER_CACHE_KEY,JSON.stringify(cached));
  }catch(e){}
  return{token:token,user:cached};
}
function clearAuthBridge_(){
  try{
    sessionStorage.removeItem(AUTH_HINT_KEY);
    sessionStorage.removeItem(SESSION_TOKEN_KEY);
    sessionStorage.removeItem(USER_CACHE_KEY);
  }catch(e){}
  try{localStorage.removeItem(AUTH_PERSIST_KEY);}catch(e){}
}


document.getElementById("dr-datetime").textContent = (function(){
  var d = new Date();
  return d.getFullYear()+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+String(d.getDate()).padStart(2,"0");
})();

function initialsOf(name){
  var parts = String(name||"").trim().split(/\s+/).filter(Boolean);
  if(parts.length>=2) return (parts[0].charAt(0)+parts[parts.length-1].charAt(0)).toUpperCase();
  return String(name||"").replace(/\s+/g,"").slice(0,2).toUpperCase();
}

function setCurrentUser(user){
  user=user&&typeof user==="object"?user:{};
  if(!user.email)throw new Error("帳戶資料未完整回傳");
  try{sessionStorage.setItem(AUTH_HINT_KEY,"1");}catch(e){}saveAuthBridge_(SESSION_TOKEN,{name:user.name||"",email:user.email||"",isAdmin:user.isAdmin===true});
  CURRENT_USER={name:user.name||user.email||"",email:user.email||"",initials:initialsOf(user.name||user.email||""),isAdmin:user.isAdmin===true};
  document.getElementById("dr-username").textContent=CURRENT_USER.name;document.getElementById("dr-avatar").textContent=CURRENT_USER.initials||"・";document.getElementById("dr-mobile-username").textContent=CURRENT_USER.name;document.getElementById("dr-mobile-avatar").textContent=CURRENT_USER.initials||"・";
}
function makeOperationId(){return window.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);}
function clearSessionToken(){SESSION_TOKEN="";clearAuthBridge_();}
function apiError(message,code){var err=new Error(message||"API 發生錯誤");err.code=code||"API_ERROR";return err;}
function fetchJsonWithTimeout(body,timeoutMs){
  if(navigator.onLine===false)return Promise.reject(apiError("目前沒有網路連線，請連線後再試。","OFFLINE"));
  var controller=window.AbortController?new AbortController():null;
  var timer=controller?setTimeout(function(){controller.abort();},timeoutMs||25000):0;
  return fetch(API_URL,{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8","Accept":"application/json"},
    body:JSON.stringify(body),
    signal:controller?controller.signal:undefined,
    cache:"no-store",
    credentials:"omit",
    redirect:"follow",
    mode:"cors"
  }).then(function(res){
    return res.text().then(function(text){
      var trimmed=String(text||"").trim();
      if(!trimmed||trimmed.charAt(0)==="<"){
        throw apiError("Apps Script Web App 目前沒有以公開 API 模式回應。請確認部署設定為「執行身分：我」及「誰可以存取：任何人」。","DEPLOYMENT_ACCESS");
      }
      var json;
      try{json=JSON.parse(trimmed);}
      catch(e){throw apiError("Apps Script 回應不是有效 JSON，請確認目前使用的是最新 Web App 部署網址。","BAD_RESPONSE");}
      if(!json||typeof json!=="object")throw apiError("Apps Script 回應格式異常。","BAD_RESPONSE");
      if(!json.ok)throw apiError(json.error||"API 發生錯誤",json.code||"API_ERROR");
      return json;
    });
  }).catch(function(err){
    if(err&&err.name==="AbortError")throw apiError("Apps Script 連線逾時。","TIMEOUT");
    if(err&&err.code)throw err;
    if(err instanceof TypeError)throw apiError("無法連到 Apps Script Web App。請確認部署網址與公開存取設定。","NETWORK_ENDPOINT");
    throw err;
  }).finally(function(){if(timer)clearTimeout(timer);});
}
function apiPost(action,data,options){
  data=data||{};options=options||{};var retries=typeof options.retries==="number"?Math.max(0,options.retries):(options.readOnly?1:0),attempts=1+retries;
  function attempt(n){var body=Object.assign({},data,{action:action});if(SESSION_TOKEN)body.sessionToken=SESSION_TOKEN;else if(GOOGLE_CREDENTIAL)body.credential=GOOGLE_CREDENTIAL;return fetchJsonWithTimeout(body,options.timeout||20000).then(function(json){if(json.sessionToken){SESSION_TOKEN=json.sessionToken;saveAuthBridge_(SESSION_TOKEN,CURRENT_USER&&CURRENT_USER.email?{name:CURRENT_USER.name||"",email:CURRENT_USER.email||"",isAdmin:CURRENT_USER.isAdmin===true}:readAuthBridge_().user);}return json;}).catch(function(err){if(err&&err.code==="AUTH_REQUIRED"){clearSessionToken();throw err;}if(n+1<attempts&&(err.code==="TIMEOUT"||err.code==="OFFLINE"||err.code==="BAD_RESPONSE"||err.code==="NETWORK_ENDPOINT")){return new Promise(function(resolve){setTimeout(resolve,450);}).then(function(){return attempt(n+1);});}throw err;});}
  return attempt(0);
}
function loadRecords(){return REMOTE_RECORDS;}
var systemMessageTimer=0;
function showSystemMessage(text,isError,autoHide){var el=document.getElementById("dr-systemmsg");clearTimeout(systemMessageTimer);el.classList.remove("is-hiding");el.textContent=text;el.style.color=isError?"#b42318":"";if(autoHide)systemMessageTimer=setTimeout(function(){el.classList.add("is-hiding");},5000);}
function showLoginGate(message,preserveView){

function applyListPayload(json,resetView){
  if(json.user)setCurrentUser(json.user);
  SERVER_NOW=json.serverNow?new Date(json.serverNow):new Date();
  REMOTE_RECORDS=Array.isArray(json.requests)?json.requests:[];

function describeEndpointError_(err){
  if(!err)return"案件資料暫時無法載入。";
  if(err.code==="DEPLOYMENT_ACCESS"||err.code==="NETWORK_ENDPOINT")return err.message;
  if(err.code==="TIMEOUT")return"Apps Script 回應逾時，請重新載入案件。";
  if(err.code==="OFFLINE")return"目前沒有網路連線。";
  return"案件資料載入失敗："+(err.message||"未知錯誤");
}
function loadRemoteRequests(resetView){
  showSystemMessage("正在載入案件清單…",false);
  hideDataRetry_();

    applyListPayload(json,resetView!==false);

    if(err&&err.code==="AUTH_REQUIRED"){

var AUTH_RECOVERY_MODE=false,googleLoginReady=false,googleIdentityPromise=null;
function showSessionSpinner(){

function renderConnectionRetry_(message,onRetry){
  var status=document.getElementById("dr-login-status"),slot=document.getElementById("dr-login-slot");
  if(status){status.className="err";status.textContent=message||"後端暫時沒有回應，請按「重新連線」再試一次。";}
  if(!slot)return;
  slot.replaceChildren();
  slot.style.visibility="";
  var btn=document.createElement("button");
  btn.type="button";
  btn.className="login-retry-btn";
  btn.textContent="重新連線";
  btn.addEventListener("click",function(){
    showSessionSpinner();
    if(status){status.className="";status.textContent="正在重新連線…";}
    onRetry();
  });
  slot.appendChild(btn);
}
function handleCredentialResponse(response){
  if(response&&response.credential)GOOGLE_CREDENTIAL=response.credential;
  var status=document.getElementById("dr-login-status");
  if(!GOOGLE_CREDENTIAL){
    status.className="err";
    status.textContent="未取得 Google 登入憑證，請重新登入。";
    waitForGoogleLogin(status.textContent);
    return;
  }
  status.className="";
  status.textContent="正在驗證 Workplace 帳戶…";

  apiPost("whoAmI",{}, {readOnly:true,retries:1,timeout:25000}).then(function(json){
    AUTH_RECOVERY_MODE=false;
    setCurrentUser(json.user||{});
    status.textContent="";
    showAuthenticatedShell_(json.user||{});
    loadRemoteRequests(true).catch(function(){});
  }).catch(function(err){
    if(err&&err.code==="AUTH_REQUIRED"){
      GOOGLE_CREDENTIAL="";
      status.className="err";
      status.textContent="Google 登入已逾時，請重新登入。";
      waitForGoogleLogin(status.textContent);
      return;
    }
    if(err&&err.code==="DEPLOYMENT_ACCESS"){
      status.className="err";
      status.textContent=err.message;
      renderConnectionRetry_(err.message,function(){handleCredentialResponse({credential:GOOGLE_CREDENTIAL});});
      return;
    }
    if(err&&["TIMEOUT","OFFLINE","BAD_RESPONSE","NETWORK_ENDPOINT"].indexOf(err.code)>=0){
      renderConnectionRetry_(
        err.code==="OFFLINE"?"目前沒有網路連線，恢復連線後請再試一次。":(err.message||"Apps Script 暫時無法連線。"),
        function(){handleCredentialResponse({credential:GOOGLE_CREDENTIAL});}
      );
      return;
    }
    GOOGLE_CREDENTIAL="";
    status.className="err";
    status.textContent="登入驗證失敗："+(err&&err.message?err.message:"未知錯誤");
    waitForGoogleLogin(status.textContent);
  });
}
function renderGoogleLoginRetry_(message){
  var status=document.getElementById("dr-login-status"),slot=document.getElementById("dr-login-slot");
  if(status){status.className="err";status.textContent=message||"Google 登入服務載入失敗，請再試一次。";}
  if(!slot)return;
  slot.replaceChildren();
  slot.style.visibility="";
  var btn=document.createElement("button");
  btn.type="button";
  btn.className="login-retry-btn";
  btn.textContent="重新載入 Google 登入";
  btn.addEventListener("click",function(){
    googleIdentityPromise=null;
    googleLoginReady=false;
    var old=document.getElementById("dr-gsi-client");if(old)old.remove();var boot=document.getElementById("dr-gsi-bootstrap");if(boot)boot.remove();
    waitForGoogleLogin("");
  });
  slot.appendChild(btn);
}
function ensureGoogleIdentity_(){
  if(window.google&&google.accounts&&google.accounts.id)return Promise.resolve();
  if(googleIdentityPromise)return googleIdentityPromise;
  googleIdentityPromise=new Promise(function(resolve,reject){
    var settled=false,timer=0;
    function done(ok){
      if(settled)return;
      settled=true;
      if(timer)clearTimeout(timer);
      ok?resolve():reject(new Error("GSI_LOAD_FAILED"));
    }
    var script=document.getElementById("dr-gsi-client")||document.getElementById("dr-gsi-bootstrap");
    if(!script){
      script=document.createElement("script");
      script.id="dr-gsi-client";
      script.src="https://accounts.google.com/gsi/client";
      script.async=true;
      script.defer=true;
      document.head.appendChild(script);
    }
    script.addEventListener("load",function(){done(!!(window.google&&google.accounts&&google.accounts.id));},{once:true});
    script.addEventListener("error",function(){done(false);},{once:true});
    timer=setTimeout(function(){
      if(window.google&&google.accounts&&google.accounts.id)done(true);
      else done(false);
    },8000);
  }).catch(function(error){
    googleIdentityPromise=null;
    throw error;
  });
  return googleIdentityPromise;
}
function renderGoogleLoginButton(){
  if(!window.google||!google.accounts||!google.accounts.id){
    renderGoogleLoginRetry_("Google 登入服務尚未載入，請再試一次。");
    return;
  }
  var slot=document.getElementById("dr-login-slot");
  if(!slot)return;
  slot.replaceChildren();
  slot.style.visibility="";
  if(!googleLoginReady){
    google.accounts.id.initialize({
      client_id:GOOGLE_CLIENT_ID,
      callback:handleCredentialResponse,
      hd:"harfunco.com",
      use_fedcm_for_button:true,
      button_auto_select:false
    });
    googleLoginReady=true;
  }
  google.accounts.id.renderButton(slot,{
    theme:"outline",
    size:"large",
    text:"signin_with",
    shape:"rectangular",
    width:300
  });
}
function startGoogleLogin(){
  var status=document.getElementById("dr-login-status");
  var bridge=readAuthBridge_();
  SESSION_TOKEN=bridge.token||"";

  if(SESSION_TOKEN){
    showSessionSpinner();
    status.className="";
    status.textContent="正在恢復登入…";
    apiPost("whoAmI",{}, {readOnly:true,retries:1,timeout:25000}).then(function(json){
      setCurrentUser(json.user||{});
      status.textContent="";
      showAuthenticatedShell_(json.user||{});
      loadRemoteRequests(true).catch(function(){});
    }).catch(function(err){
      if(err&&err.code==="AUTH_REQUIRED"){
        clearSessionToken();
        status.textContent="";
        waitForGoogleLogin("");
        return;
      }
      if(err&&err.code==="DEPLOYMENT_ACCESS"){
        renderConnectionRetry_(err.message,function(){startGoogleLogin();});
        return;
      }
      renderConnectionRetry_(
        err&&err.code==="OFFLINE"?"目前沒有網路連線，恢復連線後請再試一次。":(err&&err.message?err.message:"Apps Script 暫時無法連線。"),
        function(){startGoogleLogin();}
      );
    });
    return;
  }
  waitForGoogleLogin("");
}
function waitForGoogleLogin(preserveMessage){
  showSessionSpinner();
  var status=document.getElementById("dr-login-status");
  if(status&&!preserveMessage){status.className="";status.textContent="";}
  ensureGoogleIdentity_().then(function(){
    renderGoogleLoginButton();
  }).catch(function(){
    renderGoogleLoginRetry_("Google 登入服務載入失敗，請檢查網路後再試一次。");
  });
}

function applyDefaultSize(it){

}

function parseDate(s){ if(!s) return null; var p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function workingDaysBetween(from, to){
  if(!from || !to) return null;
  var count=0; var d=new Date(from.getFullYear(),from.getMonth(),from.getDate());
  var end=new Date(to.getFullYear(),to.getMonth(),to.getDate());
  if(end<=d) return 0;
  while(d<end){ d.setDate(d.getDate()+1); var wd=d.getDay(); if(wd!==0 && wd!==6) count++; }
  return count;
}
function todayFromServer(){
  var d = new Date(SERVER_NOW.getTime());
  d.setHours(0,0,0,0);
  return d;
}
function isClosedStatus(status){
  return status==="完稿" || status==="結案" || status==="取消" || status==="退回";
}
function isOverdue(rec){
  if(rec&&rec.flags&&typeof rec.flags.overdue==="boolean")return rec.flags.overdue;
  if(isClosedStatus(rec.status)) return false;
  var d = parseDate(rec.data.deliveryDate);
  if(!d) return false;
  return d < todayFromServer();
}
function isUrgent(rec){
  if(rec&&rec.flags&&typeof rec.flags.urgent==="boolean")return rec.flags.urgent;
  if(isClosedStatus(rec.status)) return false;
  var d = parseDate(rec.data.deliveryDate);
  if(!d) return false;
  var today = todayFromServer();
  var wd = workingDaysBetween(today, d);
  return wd!==null && wd<URGENT_WORKING_DAYS && d>=today;
}
function itemHasPrint(it){return Array.isArray(it&&it.output)&&it.output.indexOf("print")>=0;}
function itemHasCopy(it){
  var t=typeOf(it&&it.typeId);
  if(!t||t.mode==="notice")return true;
  if(t.mode==="structure"){
    return (it.blocks||[]).some(function(b){
      return !!String((b&&b.head)||"").trim()||
             !!String((b&&b.sub)||"").trim()||
             !!String((b&&b.small)||"").trim()||
             !!String((b&&b.other)||"").trim();
    });
  }
  var c=it&&it.copy||{};
  return !!String(c.head||"").trim()||
         !!String(c.sub||"").trim()||
         !!String(c.small||"").trim()||
         !!String(c.other||"").trim();
}
function isPending(rec){
  if(rec&&rec.flags&&typeof rec.flags.pending==="boolean")return rec.flags.pending;
  return ((rec&&rec.data&&rec.data.items)||[]).some(function(it){return !itemHasCopy(it);});
}
function hasError(rec){
  if(rec && rec.flags && typeof rec.flags.error==="boolean") return rec.flags.error;
  var d = rec.data || {};
  if(!String(d.name||"").trim() || !String(d.purpose||"").trim() || !d.deliveryDate) return true;
  if(!Array.isArray(d.items) || d.items.length===0) return true;
  return d.items.some(function(it){
    if(!it || !it.typeId || !typeOf(it.typeId)) return true;
    var t = typeOf(it.typeId);
    if(t.mode==="normal" && !t.forcePrint && (!Array.isArray(it.output) || it.output.length===0)) return true;
    if(itemHasPrint(it) && !String(it.printQty||"").trim()) return true;
    return false;
  });
}

function matchesFilter(rec){
  var q = document.getElementById("f-search").value.trim().toLowerCase();
  if(q){
    var hay = (rec.id+" "+rec.data.name+" "+(rec.submitter?rec.submitter.name+rec.submitter.email:"")).toLowerCase();
    if(hay.indexOf(q)===-1) return false;
  }
  var dept = document.getElementById("f-dept").value;
  if(dept && rec.data.dept!==dept) return false;
  var status = document.getElementById("f-status").value;
  if(status && rec.status!==status) return false;
  
  if(activeQuick.overdue && !isOverdue(rec)) return false;
  if(activeQuick.error && !hasError(rec)) return false;
  return true;
}

var openCardId = null; 

function cardVisualState(rec){
  var meta = STATUS_META[rec.status] || STATUS_META["待確認"];

  if(rec&&rec.isExample){
    return {bgClass:"bg-example", hover:"var(--green)"};
  }

  if(hasError(rec)){
    return {bgClass:"bg-error", hover:"var(--red)"};
  }

  if(rec.status==="退回" || rec.status==="取消"){
    return {bgClass:"bg-error", hover:meta.dot};
  }

  if(isOverdue(rec)){
    return {bgClass:"bg-overdue", hover:"var(--brand)"};
  }

  return {bgClass:"bg-normal", hover:meta.dot};
}
function applyCardVisualState_(card, rec){
  var visual = cardVisualState(rec);
  card.classList.remove("bg-error","bg-overdue","bg-normal","bg-example","is-grey");
  card.classList.add(visual.bgClass);
  card.style.setProperty("--card-hover", visual.hover);
}

function renderAll(){
  var all = loadRecords();
  var example = hasActiveFilter_() ? null : (all.find(function(r){ return r&&r.isExample; }) || null);
  var list = all.filter(function(r){ return !r.isExample; }).filter(matchesFilter);
  list.sort(function(a,b){ return new Date(b.submittedAt) - new Date(a.submittedAt); });

  document.getElementById("dr-summary").innerHTML =
    '<div>共 <b>'+list.length+'</b> 筆</div>' +
    '<div>逾期 <b>'+list.filter(function(r){return isOverdue(r);}).length+'</b> 筆</div>' +
    '<div>文案待補 <b>'+list.filter(function(r){return isPending(r);}).length+'</b> 筆</div>';

  var totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if(currentPage > totalPages) currentPage = totalPages;
  if(currentPage < 1) currentPage = 1;
  var pager = document.getElementById("dr-pager");
  pager.hidden = list.length <= PAGE_SIZE;
  document.getElementById("dr-pginfo").textContent = "第 "+currentPage+" / "+totalPages+" 頁";
  document.getElementById("dr-prev").disabled = currentPage<=1;
  document.getElementById("dr-next").disabled = currentPage>=totalPages;
  var pageList = list.slice((currentPage-1)*PAGE_SIZE, currentPage*PAGE_SIZE);

  var groupsEl = document.getElementById("dr-groups");
  groupsEl.innerHTML = "";
  document.getElementById("dr-empty").hidden = pageList.length>0 || !!example;

  var groups = {};
  var order = [];
  pageList.forEach(function(r){
    var d = new Date(r.submittedAt);
    var key = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    if(!groups[key]){ groups[key]=[]; order.push(key); }
    groups[key].push(r);
  });

  order.forEach(function(key){
    var g = document.createElement("div"); g.className="month-group";
    var parts = key.split("-");
    g.appendChild(elh("h3", parts[0]+" 年 "+parts[1]+" 月"));
    var cardsEl = document.createElement("div"); cardsEl.className="cards";
    groups[key].forEach(function(rec){ cardsEl.appendChild(renderCard(rec)); });

    var eg=document.createElement("div");eg.className="month-group example-group";

    ecards.appendChild(renderCard(example));

    groupsEl.appendChild(eg);

function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }

function setActionLoading(btn, loading, group){
  if(!btn) return;
  (group||[btn]).forEach(function(x){

function normalizeItemOutput_(it){
  if(!it)return [];
  var t=typeOf(it.typeId);
  var source=Array.isArray(it.output)?it.output:[];
  var seen=Object.create(null),out=[];
  source.forEach(function(v){
    if((v==="digital"||v==="print")&&!seen[v]){seen[v]=true;out.push(v);}
  });
  if(t&&t.forcePrint)out=["print"];
  it.output=out;
  return out;
}
function getItemBadgeSpecs_(it){
  var t=typeOf(it&&it.typeId);
  if(!t)return [];
  var specs=[],output=normalizeItemOutput_(it);
  function add(key,label,cls){
    if(specs.some(function(x){return x.key===key;}))return;
    specs.push({key:key,label:label,cls:cls});
  }
  if(t.forcePrint){
    add("output-print","印刷","print");
  }else if(t.mode!=="notice"&&t.mode!=="structure"){
    if(output.indexOf("digital")>=0)add("output-digital","數位","digital");
    if(output.indexOf("print")>=0)add("output-print","印刷","print");
  }
  if(t.mode!=="notice"){
    if(itemHasCopy(it))add("copy-ready","文案已提供","ready");
    else add("copy-pending","文案待補","pending");
  }
  return specs;
}

}

function initTouchFeedback(){
  var selector=".btn-topbar,input,select,textarea,.statuschip,.schip,.chip,.card-top,.dpanel,.itemblock,.add-line,.del-line,.structure-order button,.rm,.compact-x,.btn-sm,.pgbtn";
  var active=null,outerActive=null;
  var app=document.getElementById("dr-app");

  function clear(){
    if(active){active.classList.remove("touch-hover","is-touch-hover");active=null;}
    if(outerActive){outerActive.classList.remove("primary-touch-hover");outerActive=null;}
  }
  function applyFromNode(node){
    if(!node||!app.contains(node)){clear();return;}
    var el=node.closest&&node.closest(selector);
    var primary=node.closest&&node.closest(".request-primary");
    var nextOuter=primary&&primary.closest(".card");

    if(active!==el){
      if(active)active.classList.remove("touch-hover","is-touch-hover");
      active=el||null;
      if(active)active.classList.add("touch-hover","is-touch-hover");
    }
    if(outerActive!==nextOuter){
      if(outerActive)outerActive.classList.remove("primary-touch-hover");
      outerActive=nextOuter||null;
      if(outerActive)outerActive.classList.add("primary-touch-hover");
    }
  }
  function applyFromTouch(touch,fallback){
    if(!touch){applyFromNode(fallback||null);return;}
    var hit=document.elementFromPoint(touch.clientX,touch.clientY);
    applyFromNode(hit||fallback||null);
  }

  document.addEventListener("touchstart",function(e){
    if(!e.touches||!e.touches.length)return;
    applyFromTouch(e.touches[0],e.target);
  },{passive:true});
  document.addEventListener("touchmove",function(e){
    if(!e.touches||!e.touches.length){clear();return;}
    applyFromTouch(e.touches[0],e.target);
  },{passive:true});
  document.addEventListener("touchend",clear,{passive:true});
  document.addEventListener("touchcancel",clear,{passive:true});
  window.addEventListener("blur",clear);
  document.addEventListener("visibilitychange",function(){if(document.hidden)clear();});
}initTouchFeedback();
