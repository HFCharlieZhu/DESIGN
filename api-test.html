<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>Google Login Test</title>

  <script
    src="https://accounts.google.com/gsi/client"
    async
    defer>
  </script>
</head>

<body>

  <h2>設計需求系統登入測試</h2>

  <div id="googleButton"></div>

  <pre id="result">尚未登入</pre>

  <script>
    const GOOGLE_CLIENT_ID =
      "610204517549-khmef2c4ejmeg0jrceg53385ptu2ns03.apps.googleusercontent.com";

    const API_URL =
      "https://script.google.com/a/macros/harfunco.com/s/AKfycbyZgxQNyQuQCX_Vmp5tlrgQ6p_-pEugmehm9StOCbp3IC32WeDjYoST1iqiCuM7VZDN/exec";


    window.onload = function () {

      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse,
        hd: "harfunco.com"
      });

      google.accounts.id.renderButton(
        document.getElementById("googleButton"),
        {
          theme: "outline",
          size: "large",
          text: "signin_with"
        }
      );
    };


    async function handleCredentialResponse(response) {

      const result = document.getElementById("result");

      result.textContent =
        "Google 登入成功\n正在交給後端驗證身分...";

      try {

        const apiResponse = await fetch(API_URL, {
          method: "POST",

          // 故意使用 text/plain，避免觸發不必要的 CORS preflight
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },

          body: JSON.stringify({
            action: "whoAmI",
            credential: response.credential
          })
        });

        const data = await apiResponse.json();

        if (!data.ok) {
          throw new Error(data.error || "後端驗證失敗");
        }

        result.textContent =
          "後端驗證成功\n\n" +
          "姓名：" + (data.user.name || "") + "\n" +
          "Email：" + data.user.email + "\n" +
          "Google sub：" + data.user.sub;

      } catch (error) {

        console.error(error);

        result.textContent =
          "後端驗證失敗\n\n" +
          error.toString();
      }
    }

  </script>

</body>
</html>
