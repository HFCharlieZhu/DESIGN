<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>API Test</title>
</head>
<body>
  <button id="test">測試 Apps Script API</button>
  <pre id="result">尚未測試</pre>

  <script>
    const API_URL =
      "https://script.google.com/a/macros/harfunco.com/s/AKfycbyZgxQNyQuQCX_Vmp5tlrgQ6p_-pEugmehm9StOCbp3IC32WeDjYoST1iqiCuM7VZDN/exec";

    document.getElementById("test").addEventListener("click", async () => {
      const result = document.getElementById("result");
      result.textContent = "連線中...";

      try {
        const response = await fetch(API_URL);
        const data = await response.json();

        result.textContent =
          "成功\n\n" + JSON.stringify(data, null, 2);
      } catch (error) {
        result.textContent =
          "失敗\n\n" + error.toString();

        console.error(error);
      }
    });
  </script>
</body>
</html>
