<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>允禾發 設計需求表</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;display=swap">
<link rel="stylesheet" href="app.css">
</head>

<body>
<div id="dr-gate">
  <div class="g-title">找不到這個頁面</div>
  <div class="g-sub" id="dr-404-msg">網址有誤，請改用書籤或原本的連結開啟。</div>
  <div class="google-login-slot">
    <a class="login-retry-btn" href="index.html" id="dr-404-link">前往申請表</a>
  </div>
  <div class="g-note">若反覆看到這一頁，表示網址有誤，請改用書籤或原本的連結開啟。
    <details class="g-why notice-box">
      <summary>說明<svg class="caret" viewBox="0 0 11 7" aria-hidden="true"><path d="M1 1l4.5 4.5L10 1" stroke="#111" stroke-width="1.6" fill="none"/></svg></summary>
      網址區分大小寫，例如 /DESIGN/ 與 /design/ 為不同網址。
    </details>
  </div>
</div>

<script>
(function () {
  "use strict";
  // GitHub Pages 會把站內所有不存在的路徑導到這一頁。
  // 先停五秒讓人看清楚訊息，再自動返回申請表；只轉一次，
  // 避免 index.html 也不存在時在兩頁之間無限跳轉。
  var KEY = "dr_404_bounced";
  var SECONDS = 5;
  var msg = document.getElementById("dr-404-msg");
  var bounced = false;
  try { bounced = sessionStorage.getItem(KEY) === "1"; } catch (e) { }

  if (bounced) {
    try { sessionStorage.removeItem(KEY); } catch (e) { }
    msg.textContent = "網址有誤，請點下方按鈕或改用書籤開啟。";
    return;
  }

  try { sessionStorage.setItem(KEY, "1"); } catch (e) { }

  var left = SECONDS;
  function tick() {
    msg.textContent = "網址有誤，請改用書籤或原本的連結開啟，" + left + " 秒後自動返回申請表。";
    if (left <= 0) { location.replace("index.html"); return; }
    left -= 1;
    setTimeout(tick, 1000);
  }
  tick();
})();
</script>
</body>
</html>
